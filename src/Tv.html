<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Прачка360 — табло</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #101418; color: #eef2f5; overflow-x: hidden; }
    header { display: flex; align-items: baseline; gap: 3vw; padding: 1.5vh 2vw; }
    header h1 { font-size: 4.5vh; }
    header .date { font-size: 3.5vh; color: #9fb3c8; }
    header .clock { margin-left: auto; font-size: 5vh; font-weight: 700; }
    header .fresh { font-size: 2.5vh; color: #6f8496; }

    .counters { display: flex; gap: 1.2vw; padding: 0 2vw 1.5vh; flex-wrap: wrap; }
    .counter { background: #1a2129; border-radius: 1.5vh; padding: 1.5vh 2vw; text-align: center; flex: 1; min-width: 12vw; }
    .counter .num { font-size: 6vh; font-weight: 800; }
    .counter .lbl { font-size: 2.4vh; color: #9fb3c8; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(30vw, 1fr)); gap: 1.5vw; padding: 0 2vw 2vh; }
    .card { background: #1a2129; border-radius: 1.5vh; padding: 2vh 2vw; border-left: 1.2vh solid #666; }
    .card .client { font-size: 4vh; font-weight: 800; }
    .card .meta { font-size: 2.8vh; color: #9fb3c8; margin-top: .8vh; }
    .card .comment { font-size: 2.2vh; color: #6f8496; margin-top: .6vh; }
    .chip { display: inline-block; padding: .4vh 1.2vw; border-radius: 3vh; font-size: 2.4vh; font-weight: 700; margin-top: 1vh; }
    .st-planned { border-color: #8a97a5; } .st-planned .chip { background: #8a97a5; color: #101418; }
    .st-in_progress { border-color: #f2c94c; } .st-in_progress .chip { background: #f2c94c; color: #101418; }
    .st-done { border-color: #4caf7d; } .st-done .chip { background: #4caf7d; color: #101418; }
    .st-stored { border-color: #5b9bf0; } .st-stored .chip { background: #5b9bf0; color: #101418; }
    .chip-deferred { background: #e08a4c; color: #101418; }

    .offline { display: none; position: fixed; top: 0; left: 0; right: 0; background: #d64545; color: #fff;
      text-align: center; font-size: 3vh; font-weight: 700; padding: 1.5vh; z-index: 10; }
    .offline.show { display: block; }
    .empty { grid-column: 1/-1; text-align: center; color: #6f8496; font-size: 4vh; padding: 8vh 0; }
  </style>
</head>
<body>
  <div class="offline" id="offline">Нет связи — показаны данные на <span id="offlineTime"></span></div>
  <header>
    <h1 id="laundryName">Прачка360</h1>
    <div class="date" id="date"></div>
    <div class="clock" id="clock"></div>
    <div class="fresh" id="fresh"></div>
  </header>
  <div class="counters" id="counters"></div>
  <div class="grid" id="grid"></div>

<script>
var KEY = new URLSearchParams(location.search).get('key') || '';
var STATUS_LABELS = { planned: 'К стирке', in_progress: 'В работе', done: 'Готово', stored: 'На складе' };
// Порядок на табло (spec §7.4): «В работе» → «К стирке» → «Готово»/«На складе»
var ORDER = { in_progress: 0, planned: 1, done: 2, stored: 2 };
var lastDataAt = null;

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

function tickClock() {
  // Часы табло — локальное время устройства, дата смены — только с сервера
  var d = new Date();
  document.getElementById('clock').textContent =
    ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}
setInterval(tickClock, 5000); tickClock();

function poll() {
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || res.ok === false) return showOffline();
      hideOffline();
      render(res);
    })
    .withFailureHandler(showOffline)
    .getTvData(KEY);
}

function showOffline() {
  if (lastDataAt) document.getElementById('offlineTime').textContent = lastDataAt;
  document.getElementById('offline').classList.add('show');
}
function hideOffline() { document.getElementById('offline').classList.remove('show'); }

function render(res) {
  lastDataAt = res.updatedAt;
  document.getElementById('laundryName').textContent = res.laundryName;
  document.getElementById('date').textContent = res.date;
  document.getElementById('fresh').textContent = 'данные на ' + res.updatedAt;

  var c = res.counters;
  var cells = [
    ['Всего', c.total], ['К стирке', c.planned], ['В работе', c.in_progress],
    ['Готово', c.done], ['На складе', c.stored], ['Перенесено', c.deferred]
  ];
  document.getElementById('counters').innerHTML = cells.map(function (x) {
    return '<div class="counter"><div class="num">' + x[1] + '</div><div class="lbl">' + x[0] + '</div></div>';
  }).join('');

  var cards = (res.washes || []).slice().sort(function (a, b) {
    return (ORDER[a.status] != null ? ORDER[a.status] : 9) - (ORDER[b.status] != null ? ORDER[b.status] : 9);
  });
  document.getElementById('grid').innerHTML = cards.length ? cards.map(function (w) {
    var meta = [];
    if (w.kg !== '') meta.push(w.kg + ' кг');
    if (w.items !== '') meta.push(w.items + ' шт');
    return '<div class="card st-' + w.status + '">' +
      '<div class="client">' + esc(w.client) + '</div>' +
      '<span class="chip">' + STATUS_LABELS[w.status] + '</span>' +
      (w.deferred_from ? ' <span class="chip chip-deferred">перенесена с ' + esc(w.deferred_from) + '</span>' : '') +
      (meta.length ? '<div class="meta">' + meta.join(' · ') + '</div>' : '') +
      (w.comment ? '<div class="comment">💬 ' + esc(w.comment) + '</div>' : '') +
      '</div>';
  }).join('') : '<div class="empty">На сегодня стирок нет</div>';
}

poll();
setInterval(poll, 45000); // автополлинг каждые 45 сек (spec §7.4: 30–60 сек)
</script>
</body>
</html>
