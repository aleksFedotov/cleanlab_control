<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Прачка360</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f2f4f7; color: #1a1a1a; font-size: 18px; }
    button { font: inherit; cursor: pointer; border: none; border-radius: 12px; }
    button:disabled { opacity: .55; cursor: default; }
    input, select { font: inherit; padding: 10px; border: 1px solid #c8cdd4; border-radius: 10px; width: 100%; }

    .app-header { background: #1e3a5f; color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .app-header h1 { font-size: 22px; }
    .date-nav { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 20px; font-weight: 600; margin: 4px 0 12px; }
    .date-nav button { background: #33517c; color: #fff; width: 44px; height: 44px; font-size: 22px; }
    .date-nav .date-jump { background: none; color: inherit; width: auto; height: auto; font: inherit; padding: 4px 8px; border-radius: 8px; text-decoration: underline dotted; }
    .today-btn { width: auto; height: auto; padding: 8px 14px; font-size: 15px; font-weight: 700; background: #e3e8ef; color: #1a1a1a; }
    .search-input { margin-bottom: 12px; }
    .app-header .spacer { flex: 1; }
    .btn { padding: 12px 18px; font-size: 18px; font-weight: 600; }
    .btn-primary { background: #2f6fed; color: #fff; }
    .btn-danger { background: #d64545; color: #fff; }
    .btn-ghost { background: #e3e8ef; color: #1a1a1a; }
    .btn-big { width: 100%; padding: 18px; font-size: 22px; }

    .offline-banner { display: none; background: #d64545; color: #fff; text-align: center; padding: 10px; font-weight: 700; position: sticky; top: 0; z-index: 10; }
    .offline-banner.show { display: block; }

    .container { max-width: 720px; margin: 0 auto; padding: 16px; }
    .container.wide { max-width: 1200px; }
    .filters { display: flex; gap: 8px; margin-bottom: 14px; }
    .filters button { flex: 1; padding: 10px; background: #e3e8ef; font-weight: 600; }
    .filters button.active { background: #1e3a5f; color: #fff; }

    .card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .card .client { font-size: 22px; font-weight: 700; }
    .card .meta { color: #555; margin-top: 4px; }
    .chip { display: inline-block; padding: 3px 12px; border-radius: 20px; font-size: 15px; font-weight: 700; margin-top: 6px; }
    .chip-planned { background: #e3e8ef; color: #333; }
    .chip-in_progress { background: #ffe9a8; color: #7a5b00; }
    .chip-done { background: #c9efd0; color: #1c6b2a; }
    .chip-stored { background: #cfe3ff; color: #1d4e9e; }
    .chip-partial { background: #ffe1b3; color: #8a5a00; }
    .chip-deferred { background: #ffd9c2; color: #8a3c00; }
    .chip-no_linen { background: #eceff1; color: #607d8b; }
    .chip-ready_clean { background: #c9efd0; color: #1c6b2a; }

    .row { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
    .row > * { flex: 1; }
    .stepper { display: flex; align-items: center; gap: 8px; }
    .stepper button { width: 56px; height: 56px; font-size: 26px; background: #e3e8ef; font-weight: 700; flex: none; }
    .stepper .val { min-width: 60px; text-align: center; font-size: 22px; font-weight: 700; }
    .item-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #eee; }
    .item-row .name { flex: 1; font-size: 19px; }

    .pin-wrap { max-width: 340px; margin: 15vh auto 0; text-align: center; }
    .pin-wrap h1 { margin-bottom: 20px; }
    .pin-wrap input { text-align: center; font-size: 26px; letter-spacing: 8px; margin-bottom: 14px; }
    .err { color: #d64545; margin-top: 10px; min-height: 24px; }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 20; }
    .overlay.show { display: flex; }
    .dialog { background: #fff; border-radius: 16px; padding: 22px; max-width: 480px; width: 92%; max-height: 85vh; overflow: auto; }
    .dialog h2 { margin-bottom: 14px; }
    .dialog .actions { display: flex; gap: 10px; margin-top: 18px; }

    .blockers { background: #ffe1e1; border: 2px solid #d64545; border-radius: 14px; padding: 14px; margin-bottom: 14px; }
    .blockers .brow { font-size: 15px; padding: 3px 0; }
    .blockers .brow .why { color: #777; }
    /* Развоз: компактные строки визитов и клиентов */
    .vrow { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; border-left: 4px solid #2f6fed; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    .vrow .nm { flex: 1; font-weight: 700; }
    .vrow .cm { font-size: 13px; color: #555; font-weight: 400; }
    .vrow .rm { flex: none; width: 36px; height: 36px; background: #f6d5d5; color: #c0392b; font-size: 18px; }
    .vrow .add { flex: none; width: 36px; height: 36px; background: #2f6fed; color: #fff; font-size: 20px; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1c6b2a; color: #fff; padding: 12px 24px; border-radius: 12px; font-weight: 700; display: none; z-index: 30; }
    .toast.err { background: #d64545; }
    .toast.show { display: block; }
    .empty { text-align: center; color: #777; padding: 40px 0; }
    .spinner { font-weight: 600; }

    .tabs { display: flex; background: #fff; border-bottom: 1px solid #dde2e8; }
    .tabs button { flex: 1; padding: 14px 4px; background: none; border-radius: 0; font-weight: 600; color: #555; border-bottom: 3px solid transparent; }
    .tabs button.active { color: #1e3a5f; border-bottom-color: #2f6fed; }
    h2 { margin: 18px 0 10px; font-size: 20px; }
    table.report { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; font-size: 15px; }
    table.report th, table.report td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #eee; vertical-align: top; }
    table.report th { background: #1e3a5f; color: #fff; }
    table.report details.pos summary { cursor: pointer; list-style: none; color: #2f6fed; font-weight: 600; user-select: none; }
    table.report details.pos[open] summary { margin-bottom: 4px; }
    table.report .pos-list div { padding: 2px 0; }
    .overdue { border-left: 6px solid #d64545; }
    .summary { display: flex; flex-wrap: wrap; gap: 8px; }
    .summary .chip { font-size: 16px; padding: 8px 14px; }

    /* Доска недели: grid ужимает колонки в ширину экрана, без горизонтальной прокрутки */
    .week-board { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: start; }
    .week-col { min-width: 0; background: #fff; border-radius: 12px; padding: 6px; border: 2px solid transparent; }
    .week-col h3 { font-size: 13px; margin-bottom: 6px; text-align: center; white-space: nowrap; overflow: hidden; }
    .week-col.today { background: #e8f0fe; border-color: #2f6fed; }
    .week-col.today h3 { color: #2f6fed; }
    .wcard { background: #f2f4f7; border-radius: 10px; padding: 6px 8px; margin-bottom: 6px; cursor: pointer; overflow: hidden; border-left: 4px solid transparent; }
    .wcard.todo-dirty { background: #ffe9c2; border-left-color: #e8a13a; }
    .wcard.todo-nodirty { background: #f8d7da; border-left-color: #c0392b; }
    .wcard.nolinen { background: #eceff1; border-left-color: #90a4ae; opacity: .75; }
    .wcard.todo-clean { background: #d4edda; border-left-color: #28a745; }
    .wcard.doing { background: #cfe3ff; border-left-color: #1d4e9e; }
    .wcard.partial { background: #ffe9a8; border-left-color: #e8b400; }
    .wcard.done { background: #a9d9b8; border-left-color: #1c6b2a; }
    .wcard.drv { background: #fff; border-left-color: #2f6fed; border: 1px solid #dde3ea; border-left: 4px solid #2f6fed; padding: 12px; margin-bottom: 10px; }
    .wcard.drv .nm { font-size: 16px; }
    /* Склад: единый вид карточек, цвет полосы = секция */
    .wcard.st { background: #fff; border: 1px solid #dde3ea; border-left: 4px solid #c4ccd6; padding: 12px; margin-bottom: 10px; }
    .wcard.st .nm { font-size: 16px; }
    .wcard.st-clean { border-left-color: #1c6b2a; }
    .wcard.st-partial { border-left-color: #e8b400; }
    .wcard.st-dirty { border-left-color: #e8a13a; }
    .wcard.st .overdue { color: #c0392b; font-weight: 700; }
    .wcard .nm { font-weight: 700; font-size: 14px; }
    .wcard .cm { font-size: 12px; color: #555; margin-top: 2px; }
    .week-add { width: 100%; background: #e3e8ef; padding: 6px; font-size: 16px; }
    /* Узкие экраны: 4 и 2 колонки, доска уходит в вертикальную прокрутку страницы */
    @media (max-width: 900px) { .week-board { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 520px) { .week-board { grid-template-columns: repeat(2, 1fr); } }

    /* Дневная доска цеха: К стирке / В работе / Готово */
    .day-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; align-items: start; margin-bottom: 12px; }
    @media (max-width: 520px) { .day-board { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="offline-banner" id="offlineBanner">Нет связи — данные НЕ сохранены</div>
  <div id="app"></div>
  <div class="overlay" id="overlay"><div class="dialog" id="dialog"></div></div>
  <div class="toast" id="toast"></div>

<script>
// ===== Состояние =====
var state = {
  token: localStorage.getItem('cl_token') || null,
  role: localStorage.getItem('cl_role') || null,
  date: null,            // 'yyyy-MM-dd' — всегда с сервера
  day: null,             // ответ getDayList
  counts: {},            // washId -> {itemTypeId: qty} несохранённый пересчёт
  weights: {}            // washId -> введённый вес (не терять при потере связи)
};

// ===== Связь с сервером =====
function api(fnName) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    var attempts = 0;
    function run() {
      google.script.run
        .withSuccessHandler(function (res) {
          hideOffline();
          if (res && res.ok === false) {
            if (res.error === 'Нет доступа') { backToPin(); }
            reject(new Error(res.error));
          } else resolve(res);
        })
        .withFailureHandler(function (e) {
          attempts++;
          // Холодный старт GAS иногда роняет первый вызов — один повтор через 1.5 сек
          if (attempts < 2) { setTimeout(run, 1500); return; }
          showOffline();
          reject(e);
        })[fnName].apply(null, args);
    }
    run();
  });
}
function showOffline() { document.getElementById('offlineBanner').classList.add('show'); }
function hideOffline() { document.getElementById('offlineBanner').classList.remove('show'); }
function toast(msg, isErr) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  t.classList.toggle('err', !!isErr);
  setTimeout(function () { t.classList.remove('show'); }, 2500);
}
function backToPin() {
  // Несохранённые данные на экране (state.counts/weights) не сбрасываем
  state.token = null; state.role = null;
  localStorage.removeItem('cl_token'); localStorage.removeItem('cl_role');
  renderPin();
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

// Блокировка кнопки на время запроса со спиннером
function busy(btn, text) {
  btn.disabled = true;
  btn.dataset.label = btn.textContent;
  btn.innerHTML = '<span class="spinner">' + esc(text) + '</span>';
}
function unbusy(btn) {
  btn.disabled = false;
  btn.textContent = btn.dataset.label || btn.textContent;
}

// Диалог перехода к произвольной дате; go(dateStr) вызывается с выбранной датой
function openDateJump(go, current) {
  showDialog('<h2>Перейти к дате</h2>' +
    '<div class="row"><input type="date" id="jumpDate" value="' + esc(current || state.date) + '"></div>' +
    '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Отмена</button>' +
    '<button class="btn btn-primary" id="dlgGo">Перейти</button></div>');
  document.getElementById('dlgCancel').onclick = hideDialog;
  document.getElementById('dlgGo').onclick = function () {
    var v = document.getElementById('jumpDate').value;
    if (!v) return;
    hideDialog();
    go(v);
  };
}

// Подтверждение деструктивного действия
function confirmDialog(text, okLabel, onOk) {
  showDialog('<h2>' + esc(text) + '</h2>' +
    '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Отмена</button>' +
    '<button class="btn btn-danger" id="dlgOk">' + esc(okLabel) + '</button></div>');
  document.getElementById('dlgCancel').onclick = hideDialog;
  document.getElementById('dlgOk').onclick = function () { onOk(); };
}

// ===== Вход =====
function renderPin() {
  document.getElementById('app').innerHTML =
    '<div class="pin-wrap"><h1>Прачка360</h1>' +
    '<input type="password" inputmode="numeric" id="pinInput" placeholder="PIN" autofocus>' +
    '<button class="btn btn-primary btn-big" id="pinBtn">Войти</button>' +
    '<div class="err" id="pinErr"></div></div>';
  var btn = document.getElementById('pinBtn');
  var input = document.getElementById('pinInput');
  function doLogin() {
    busy(btn, 'Входим…');
    api('login', input.value).then(function (res) {
      state.token = res.token; state.role = res.role;
      localStorage.setItem('cl_token', res.token);
      localStorage.setItem('cl_role', res.role);
      if (res.role === 'driver') loadDriver(); else loadDay();
    }).catch(function (e) {
      unbusy(btn);
      document.getElementById('pinErr').textContent = e.message || 'Ошибка входа';
    });
  }
  btn.onclick = doLogin;
  input.onkeydown = function (e) { if (e.key === 'Enter') doLogin(); };
}

// ===== Список дня =====
var STATUS_LABELS = { planned: 'К стирке', in_progress: 'В работе', done: 'Готово', stored: 'На складе', partial: 'Частично',
  no_linen: 'Нет белья', ready_clean: 'Чистое на складе',
  delivered: 'Выдано', picked: 'Забрано', both: 'Выдано + забрано', empty: 'Ничего нет', cancelled: 'Отменено' };

// 'HH:MM' из 'yyyy-MM-dd HH:mm:ss' (пустая строка, если формата нет)
function timeOf(s) { return (s || '').length >= 16 ? String(s).slice(11, 16) : ''; }

function loadDay(date) {
  if (date) state.date = date;
  var d = state.date;
  var call = d ? api('getDayList', state.token, d) : api('getDayList', state.token, '');
  // Сервер вернёт date; при пустой дате берём «сегодня» с сервера (TZ скрипта)
  call.then(function (res) {
    state.date = res.date;
    // today — только серверное «сегодня» (вызов без даты), не произвольная выбранная дата
    if (!state.today && !d) state.today = res.date;
    state.day = res;
    renderDay();
  }).catch(function () {
    // Не глотаем ошибку: экран с повтором вместо молчаливого зависания
    document.getElementById('app').innerHTML =
      '<div class="pin-wrap"><h1>Прачка360</h1>' +
      '<div class="empty">Не удалось загрузить данные. Проверьте связь.</div>' +
      '<button class="btn btn-primary btn-big" id="retryLoad">Повторить</button></div>';
    document.getElementById('retryLoad').onclick = function () { loadDay(); };
  });
}

function shiftDate(days) {
  var p = state.date.split('-').map(Number);
  var t = Date.UTC(p[0], p[1] - 1, p[2]) + days * 86400000;
  var dt = new Date(t);
  var s = dt.getUTCFullYear() + '-' + ('0' + (dt.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + dt.getUTCDate()).slice(-2);
  loadDay(s);
}

function renderDay() {
  var day = state.day;
  var shiftClosed = day.shift && day.shift.status === 'closed';
  var html = '<div class="app-header"><h1>' + esc(day.laundryName || 'Прачка360') + '</h1>' +
    '<div class="spacer"></div>' +
    (shiftClosed
      ? '<span class="chip chip-done">Смена закрыта в ' + esc(day.shift.closed_at) + '</span>'
      : '<button class="btn btn-danger" id="closeShiftBtn">Закрыть смену</button>') +
    '<button class="btn btn-ghost" id="logoutBtn">Выход</button></div>' +
    ownerTabs('day') +
    '<div class="container">' +
    '<div class="date-nav"><button id="prevDay">‹</button><button class="date-jump" id="dateJump">' + esc(state.date) + '</button><button id="nextDay">›</button>' +
    (state.date !== state.today ? '<button class="today-btn" id="todayBtn">Сегодня</button>' : '') + '</div>' +
    '<div id="washList"></div>' +
    '<button class="btn btn-primary btn-big" id="addWashBtn">+ Добавить стирку</button></div>';
  document.getElementById('app').innerHTML = html;

  document.getElementById('prevDay').onclick = function () { shiftDate(-1); };
  document.getElementById('nextDay').onclick = function () { shiftDate(1); };
  document.getElementById('dateJump').onclick = function () { openDateJump(loadDay); };
  var todayBtn = document.getElementById('todayBtn');
  if (todayBtn) todayBtn.onclick = function () { loadDay(state.today); };
  document.getElementById('logoutBtn').onclick = function () {
    api('logout', state.token).finally(backToPin);
  };
  var closeBtn = document.getElementById('closeShiftBtn');
  if (closeBtn) closeBtn.onclick = openShiftClose;
  document.getElementById('addWashBtn').onclick = openAddWash;
  bindTabs();
  renderWashList();
}

function renderWashList() {
  var washes = state.day.washes || [];
  var cols = [
    { key: 'todo', title: 'К стирке', match: function (w) { return w.status === 'planned' || w.status === 'no_linen'; } },
    { key: 'doing', title: 'В работе', match: function (w) { return w.status === 'in_progress'; } },
    { key: 'done', title: 'Готово', match: function (w) { return w.status === 'done' || w.status === 'stored' || w.status === 'partial' || w.status === 'ready_clean'; } }
  ];
  var cardHtml = function (w) {
    var meta = [];
    if (w.dirty_weight_kg !== '' && w.dirty_weight_kg != null) meta.push(w.dirty_weight_kg + ' кг');
    if (w.items_total !== '' && w.items_total != null) meta.push(w.items_total + ' шт');
    if (Number(w.bags) > 0) meta.push(w.bags + ' меш.');
    if (w.status === 'stored') meta.push('выдача ' + esc(w.issue_date));
    var cls = '';
    if (w.status === 'in_progress') cls = ' doing';
    else if (w.status === 'partial') cls = ' partial';
    else if (w.status === 'done' || w.status === 'stored' || w.status === 'ready_clean') cls = ' done';
    else if (w.status === 'no_linen') cls = ' nolinen';
    else if (w.status === 'planned') cls = w.has_dirty ? ' todo-dirty' : (w.has_clean ? ' todo-clean' : ' todo-nodirty');
    return '<div class="wcard' + cls + '" data-id="' + w.id + '">' +
      '<div class="nm">' + esc(w.client_name) + '</div>' +
      (w.status === 'no_linen' ? '<div class="cm">🔴 Белья нет · ✓ проверено ' + timeOf(w.done_at) + '</div>' : '') +
      (w.status === 'ready_clean' ? '<div class="cm">🟢 Чистое бельё · ✓ проверено ' + timeOf(w.done_at) + '</div>' : '') +
      (w.status === 'planned' ? '<div class="cm">' +
        (w.has_dirty ? 'Есть грязное — можно в работу' : (w.has_clean ? 'Бельё уже чистое' : 'Нет белья на складе')) + '</div>' : '') +
      (w.deferred_from ? '<div class="cm">⤷ с ' + esc(w.deferred_from) + '</div>' : '') +
      (meta.length ? '<div class="cm">' + meta.join(' · ') + '</div>' : '') +
      (w.comment ? '<div class="cm">💬 ' + esc(w.comment) + '</div>' : '') +
      (w.status === 'stored' ? '<div class="cm">На складе</div>' : '') +
      (w.status === 'partial' ? '<div class="cm">⚠ Частично — клиент не готов</div>' : '') +
      '</div>';
  };
  document.getElementById('washList').innerHTML =
    '<input class="search-input" id="washSearch" placeholder="Поиск по клиенту…">' +
    '<div class="day-board">' + cols.map(function (col) {
      var list = washes.filter(col.match);
      return '<div class="week-col"><h3>' + col.title + ' (' + list.length + ')</h3>' +
        (list.length ? list.map(cardHtml).join('') : '<div class="cm" style="text-align:center;padding:6px">—</div>') +
        '</div>';
    }).join('') + '</div>';
  document.getElementById('washSearch').oninput = function () {
    var q = this.value.trim().toLowerCase();
    Array.prototype.forEach.call(document.querySelectorAll('#washList .wcard'), function (c) {
      var nm = c.querySelector('.nm').textContent.toLowerCase();
      c.style.display = !q || nm.indexOf(q) !== -1 ? '' : 'none';
    });
  };
  Array.prototype.forEach.call(document.querySelectorAll('#washList .wcard'), function (c) {
    c.onclick = function () { renderWashCard(c.dataset.id); };
  });
}

// ===== Карточка стирки =====
function findWash(id) {
  return (state.day.washes || []).find(function (w) { return w.id === id; });
}

function renderWashCard(id) {
  var w = findWash(id);
  if (!w) return loadDay();
  var types = state.day.itemTypes || [];
  var counts = state.counts[id] || {};
  var weight = state.weights[id] != null ? state.weights[id] : (w.dirty_weight_kg || '');
  var canEdit = w.status === 'done' || w.status === 'stored' || w.status === 'partial';

  var html = '<div class="app-header"><button class="btn btn-ghost" id="backBtn">← Список</button>' +
    '<h1>' + esc(w.client_name) + '</h1><div class="spacer"></div>' +
    '<span class="chip chip-' + w.status + '">' + STATUS_LABELS[w.status] + '</span></div>' +
    '<div class="container">' +
    (w.comment ? '<div class="card"><div class="meta">💬 ' + esc(w.comment) + '</div></div>' : '') +
    '<div class="card"><div class="meta">Выдача: <b>' + esc(w.issue_date) + '</b></div>';

  // Шаг 1: перевод в работу + проверка склада (спека «check storage»).
  // «В работу» доступна, когда грязное есть по системе или рабочий его подтвердил.
  // «Проверить на складе» — диалог с тремя вариантами: подтвердить текущее
  // состояние или изменить на любое из двух других.
  if (w.status === 'planned' || w.status === 'no_linen') {
    var dirtyOk = w.has_dirty || (state.checkedDirty || {})[id];
    if (w.status === 'no_linen') {
      html += '<div class="meta">🔴 Белья нет — проверено в ' + timeOf(w.done_at) + '.</div>';
    }
    if (dirtyOk) {
      html += '<div class="row"><button class="btn btn-primary btn-big" id="startBtn">В работу</button></div>';
    } else if (w.status === 'planned' && w.has_clean) {
      html += '<div class="meta">Грязного нет. На складе уже есть чистое бельё этого клиента.</div>';
    } else if (w.status === 'planned') {
      html += '<div class="meta">Грязного белья этого клиента на складе нет — стирать нечего.</div>';
    }
    html += '<div class="row"><button class="btn btn-ghost btn-big" id="checkStorageBtn">Проверить на складе</button></div>';
  }

  if (w.status === 'ready_clean') {
    html += '<div class="meta">🟢 Чистое бельё уже на складе — проверено в ' + timeOf(w.done_at) +
      '. Стирать не нужно, клиент готов к развозу.</div>';
  }

  // Шаг 2: вес чистого + пересчёт (в работе или правка завершённой)
  if (w.status === 'in_progress' || canEdit) {
    if (w.status === 'in_progress') {
      html += '<div class="meta">Вес чистого белья, кг:</div>' +
        '<div class="row"><div class="stepper">' +
        '<button data-w="-1">−1</button><button data-w="-0.1">−0.1</button>' +
        '<div class="val" id="weightVal">' + (weight || 0) + '</div>' +
        '<button data-w="0.1">+0.1</button><button data-w="1">+1</button><button data-w="5">+5</button></div></div>' +
        '<div class="meta">Мешков получилось:</div>' +
        '<div class="row"><div class="stepper">' +
        '<button data-b="-1">−</button>' +
        '<div class="val" id="bagsVal">' + ((state.bags || {})[id] || 0) + '</div>' +
        '<button data-b="1">+</button></div></div>';
    } else {
      html += '<div class="meta">Вес: <b>' + esc(w.dirty_weight_kg) + ' кг</b>' +
        (Number(w.bags) > 0 ? ' · Мешков: <b>' + esc(w.bags) + '</b>' : '') + '</div>';
    }
    html += '</div><div class="card"><h2>Пересчёт чистого</h2><div id="countList">' +
      types.map(function (t) {
        var q = counts[t.id] || 0;
        return '<div class="item-row"><span class="name">' + esc(t.name) + '</span>' +
          '<div class="stepper"><button data-t="' + t.id + '" data-d="-1">−</button>' +
          '<span class="val" id="q_' + t.id + '">' + q + '</span>' +
          '<button data-t="' + t.id + '" data-d="1">+</button></div></div>';
      }).join('') + '</div>' +
      '<div class="meta" style="margin-top:10px;font-size:20px">Всего: <b id="totalQty">' + totalQty(counts) + '</b> шт</div>';
    if (w.status === 'in_progress') {
      html += '<div class="row"><button class="btn btn-primary btn-big" id="completeBtn">Завершить стирку</button></div>';
    }
    if (canEdit) {
      html += '<div class="row"><button class="btn btn-ghost btn-big" id="editBtn">Изменить данные</button></div>';
    }
  }

  // Перенос (planned/in_progress)
  if (w.status === 'planned' || w.status === 'in_progress') {
    html += '<div class="row"><button class="btn btn-ghost btn-big" id="deferBtn">Перенести</button></div>';
  }
  html += '</div></div>';
  document.getElementById('app').innerHTML = html;

  document.getElementById('backBtn').onclick = renderDay;

  // В работу — без веса (грязное есть по системе или подтверждено рабочим)
  if (w.status === 'planned' || w.status === 'no_linen') {
    var startBtn = document.getElementById('startBtn');
    if (startBtn) startBtn.onclick = function () {
      busy(startBtn, 'Сохраняем…');
      api('startWash', state.token, id).then(function () {
        toast('В работе ✓');
        loadDay(); // возвращаемся на доску цеха
      }).catch(function (e) { unbusy(startBtn); toast(e.message, true); });
    };
    var checkBtn = document.getElementById('checkStorageBtn');
    if (checkBtn) checkBtn.onclick = function () { openStorageCheck(w); };
  }

  // Вес чистого (в работе)
  if (w.status === 'in_progress') {
    Array.prototype.forEach.call(document.querySelectorAll('[data-w]'), function (b) {
      b.onclick = function () {
        var cur = parseFloat(document.getElementById('weightVal').textContent) || 0;
        var next = Math.max(0, Math.round((cur + parseFloat(b.dataset.w)) * 10) / 10);
        document.getElementById('weightVal').textContent = next;
        state.weights[id] = next;
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-b]'), function (b) {
      b.onclick = function () {
        var cur = parseInt(document.getElementById('bagsVal').textContent, 10) || 0;
        var next = Math.max(0, cur + parseInt(b.dataset.b, 10));
        document.getElementById('bagsVal').textContent = next;
        (state.bags = state.bags || {})[id] = next;
      };
    });
  }

  // Пересчёт
  Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (b) {
    b.onclick = function () {
      var tid = b.dataset.t;
      state.counts[id] = state.counts[id] || {};
      var q = Math.max(0, (state.counts[id][tid] || 0) + parseInt(b.dataset.d, 10));
      state.counts[id][tid] = q;
      document.getElementById('q_' + tid).textContent = q;
      document.getElementById('totalQty').textContent = totalQty(state.counts[id]);
    };
  });

  var completeBtn = document.getElementById('completeBtn');
  if (completeBtn) completeBtn.onclick = function () { confirmComplete(w); };

  var editBtn = document.getElementById('editBtn');
  if (editBtn) editBtn.onclick = function () { confirmEdit(w); };

  var deferBtn = document.getElementById('deferBtn');
  if (deferBtn) deferBtn.onclick = function () { openDefer(w); };
}

function totalQty(counts) {
  return Object.keys(counts || {}).reduce(function (s, k) { return s + (counts[k] || 0); }, 0);
}
function countsToItems(counts) {
  return Object.keys(counts || {}).filter(function (k) { return counts[k] > 0; })
    .map(function (k) { return { item_type_id: k, qty: counts[k] }; });
}
function loadDayAndCard(id) {
  api('getDayList', state.token, state.date).then(function (res) {
    state.day = res;
    renderWashCard(id);
  }).catch(function () {});
}

// Подтверждение завершения: клиент, вес чистого, позиции, итог
function confirmComplete(w) {
  var counts = state.counts[w.id] || {};
  var kg = state.weights[w.id] != null ? state.weights[w.id] : (parseFloat(w.dirty_weight_kg) || 0);
  if (kg <= 0) return toast('Укажите вес чистого белья', true);
  var bags = (state.bags || {})[w.id] || 0;
  var types = {};
  (state.day.itemTypes || []).forEach(function (t) { types[t.id] = t.name; });
  var lines = countsToItems(counts).map(function (it) {
    return '<div>' + esc(types[it.item_type_id] || it.item_type_id) + ' ×' + it.qty + '</div>';
  }).join('');
  showDialog('<h2>Завершить стирку?</h2>' +
    '<div class="meta"><b>' + esc(w.client_name) + '</b> · ' + esc(kg) + ' кг · ' + bags + ' меш.</div>' +
    (lines || '<div class="meta">Позиций нет</div>') +
    '<div class="meta" style="margin-top:8px">Итого: <b>' + totalQty(counts) + ' шт</b></div>' +
    '<div class="row" style="margin-top:8px">' +
    '<label><input type="radio" name="wmode" value="full" checked> Полностью — клиент готов к развозу</label></div>' +
    '<div class="row"><label><input type="radio" name="wmode" value="partial"> Частично — чистое на склад, клиент НЕ готов</label></div>' +
    '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Назад</button>' +
    '<button class="btn btn-primary" id="dlgOk">Подтвердить</button></div>');
  document.getElementById('dlgCancel').onclick = hideDialog;
  var okBtn = document.getElementById('dlgOk');
  okBtn.onclick = function () {
    busy(okBtn, 'Завершаем…');
    var mode = document.querySelector('input[name="wmode"]:checked').value;
    api('completeWash', state.token, w.id, countsToItems(counts), kg, mode, bags).then(function (res) {
      delete state.counts[w.id];
      delete state.weights[w.id];
      if (state.bags) delete state.bags[w.id];
      hideDialog();
      toast(res.wash.status === 'partial' ? 'Частично завершено: чистое на складе' :
        res.wash.status === 'stored' ? 'Стирка завершена ✓ бельё на склад' : 'Стирка завершена ✓');
      loadDay();
    }).catch(function (e) { hideDialog(); toast(e.message, true); });
  };
}

// Проверка склада: три варианта в любом состоянии — подтвердить текущее
// или изменить на одно из двух других.
function openStorageCheck(w) {
  var current = w.status === 'no_linen' ? 'no_dirty'
    : w.status === 'ready_clean' ? 'already_clean'
    : w.has_dirty || (state.checkedDirty || {})[w.id] ? 'has_dirty'
    : w.has_clean ? 'already_clean' : 'no_dirty';
  var LABELS = {
    has_dirty: 'Есть грязное бельё',
    no_dirty: 'Нет белья на складе',
    already_clean: 'Есть чистое бельё'
  };
  var order = [current].concat(['has_dirty', 'no_dirty', 'already_clean'].filter(function (v) { return v !== current; }));
  var html = '<h2>Проверка склада</h2>' +
    '<div class="meta"><b>' + esc(w.client_name) + '</b></div>' +
    order.map(function (v, i) {
      var prefix = i === 0 ? 'Подтвердить: ' : 'Изменить: ';
      var cls = i === 0 ? 'btn btn-primary' : (v === 'no_dirty' ? 'btn btn-danger' : 'btn btn-ghost');
      return '<div class="row"><button class="' + cls + ' btn-big" data-verdict="' + v + '">' + prefix + LABELS[v] + '</button></div>';
    }).join('') +
    '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Назад</button></div>';
  showDialog(html);
  document.getElementById('dlgCancel').onclick = hideDialog;
  Array.prototype.forEach.call(document.querySelectorAll('[data-verdict]'), function (b) {
    b.onclick = function () {
      var verdict = b.dataset.verdict;
      busy(b, 'Сохраняем…');
      api('confirmStorageCheck', state.token, w.id, verdict).then(function () {
        hideDialog();
        if (verdict === 'has_dirty') {
          (state.checkedDirty = state.checkedDirty || {})[w.id] = true;
          toast('Грязное подтверждено ✓');
          loadDayAndCard(w.id); // остаёмся в карточке — появится «В работу»
        } else {
          toast('Подтверждено ✓');
          loadDay(); // стирка снята — назад на доску
        }
      }).catch(function (e) { unbusy(b); toast(e.message, true); });
    };
  });
}

function confirmEdit(w) {
  var counts = state.counts[w.id] || {};
  showDialog('<h2>Сохранить изменённые данные?</h2>' +
    '<div class="meta">Новый пересчёт: <b>' + totalQty(counts) + ' шт</b></div>' +
    '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Назад</button>' +
    '<button class="btn btn-primary" id="dlgOk">Сохранить</button></div>');
  document.getElementById('dlgCancel').onclick = hideDialog;
  var okBtn = document.getElementById('dlgOk');
  okBtn.onclick = function () {
    busy(okBtn, 'Сохраняем…');
    api('editWashData', state.token, w.id, w.dirty_weight_kg, countsToItems(counts), w.bags)
      .then(function () {
        delete state.counts[w.id];
        hideDialog(); toast('Данные обновлены ✓'); loadDayAndCard(w.id);
      }).catch(function (e) { hideDialog(); toast(e.message, true); });
  };
}

// ===== Перенос =====
function openDefer(w) {
  showDialog('<h2>Перенести стирку</h2>' +
    '<div class="row"><button class="btn btn-ghost" data-shift="1">Завтра</button>' +
    '<button class="btn btn-ghost" data-shift="2">Послезавтра</button></div>' +
    '<div class="row"><input type="date" id="deferDate"></div>' +
    '<div class="row"><input type="text" id="deferReason" placeholder="Причина (необязательно)"></div>' +
    '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Назад</button>' +
    '<button class="btn btn-primary" id="dlgOk">Перенести</button></div>');
  var p = w.wash_date.split('-').map(Number);
  function fmt(t) { var d = new Date(t); return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2); }
  var base = Date.UTC(p[0], p[1] - 1, p[2]);
  document.getElementById('deferDate').value = fmt(base + 86400000);
  Array.prototype.forEach.call(document.querySelectorAll('[data-shift]'), function (b) {
    b.onclick = function () {
      document.getElementById('deferDate').value = fmt(base + parseInt(b.dataset.shift, 10) * 86400000);
    };
  });
  document.getElementById('dlgCancel').onclick = hideDialog;
  var okBtn = document.getElementById('dlgOk');
  okBtn.onclick = function () {
    var newDate = document.getElementById('deferDate').value;
    if (!newDate) return;
    busy(okBtn, 'Переносим…');
    api('deferWash', state.token, w.id, newDate, document.getElementById('deferReason').value)
      .then(function () { hideDialog(); toast('Стирка перенесена ✓'); loadDay(); })
      .catch(function (e) { hideDialog(); toast(e.message, true); });
  };
}

// ===== Внеплановая стирка =====
function openAddWash() {
  var clients = (state.day.clients || []);
  showDialog('<h2>Новая стирка (сегодня)</h2>' +
    '<div class="row"><select id="addClient">' + clients.map(function (c) {
      return '<option value="' + c.id + '">' + esc(c.name) + '</option>';
    }).join('') + '</select></div>' +
    '<div class="row"><input type="text" id="addComment" placeholder="Комментарий"></div>' +
    '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Назад</button>' +
    '<button class="btn btn-primary" id="dlgOk">Добавить</button></div>');
  document.getElementById('dlgCancel').onclick = hideDialog;
  var okBtn = document.getElementById('dlgOk');
  okBtn.onclick = function () {
    busy(okBtn, 'Сохраняем…');
    api('addUnplannedWash', state.token, document.getElementById('addClient').value,
        document.getElementById('addComment').value)
      .then(function () { hideDialog(); toast('Стирка добавлена ✓'); loadDay(); })
      .catch(function (e) { hideDialog(); toast(e.message, true); });
  };
}

// ===== Закрытие смены =====
function openShiftClose() {
  api('getShiftCloseState', state.token).then(function (res) {
    var html = '<h2>Закрытие смены ' + esc(res.date) + '</h2>';
    if (res.blockers.length) {
      html += '<div class="blockers"><b>Незавершённые стирки:</b>' + res.blockers.map(function (w) {
        return '<div class="row"><span>' + esc(w.client_name) + '</span>' +
          '<button class="btn btn-ghost" data-open="' + w.id + '">Открыть</button></div>';
      }).join('') + '</div>' +
      '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Назад</button></div>';
    } else {
      var r = res.report;
      html += '<div class="meta">Постирано <b>' + r.totalKg + ' кг</b> · Завершено <b>' + r.washesDone +
        '</b> · Перенесено <b>' + r.deferred + '</b></div>';
      if (res.notReady && res.notReady.length) {
        var REASONS = { washing_incomplete: 'стирка не завершена', partial: 'стирка частичная', no_clean: 'нет чистого белья' };
        html += '<div class="blockers"><b>⚠ К завтрашнему развозу не готовы:</b>' + res.notReady.map(function (n) {
          return '<div class="meta">' + esc(n.client_name) + ' — ' + (REASONS[n.reason] || n.reason) + '</div>';
        }).join('') + '</div>';
      }
      html += '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Назад</button>' +
        '<button class="btn btn-danger" id="dlgOk">Закрыть смену</button></div>';
    }
    showDialog(html);
    document.getElementById('dlgCancel').onclick = hideDialog;
    Array.prototype.forEach.call(document.querySelectorAll('[data-open]'), function (b) {
      b.onclick = function () { hideDialog(); renderWashCard(b.dataset.open); };
    });
    var okBtn = document.getElementById('dlgOk');
    if (okBtn) okBtn.onclick = function () {
      busy(okBtn, 'Закрываем…');
      api('closeShift', state.token).then(function () {
        hideDialog(); toast('Смена закрыта ✓'); loadDay();
      }).catch(function (e) { hideDialog(); toast(e.message, true); });
    };
  }).catch(function (e) { toast(e.message, true); });
}

// ===== Экран водителя =====
function loadDriver(date) {
  if (date) state.date = date;
  var d = state.date;
  var call = d ? api('getDriverRoute', state.token, d) : api('getDriverRoute', state.token, '');
  call.then(function (res) {
    state.date = res.date;
    if (!state.today && !d) state.today = res.date;
    state.route = res;
    renderDriver();
  }).catch(function () {
    document.getElementById('app').innerHTML =
      '<div class="pin-wrap"><h1>Прачка360</h1>' +
      '<div class="empty">Не удалось загрузить маршрут. Проверьте связь.</div>' +
      '<button class="btn btn-primary btn-big" id="retryLoad">Повторить</button></div>';
    document.getElementById('retryLoad').onclick = function () { loadDriver(); };
  });
}

function renderDriver() {
  var route = state.route;
  var html = '<div class="app-header"><h1>' + esc(route.laundryName || 'Прачка360') + '</h1>' +
    '<div class="spacer"></div>' +
    '<button class="btn btn-ghost" id="logoutBtn">Выход</button></div>' +
    '<div class="container">' +
    '<div class="date-nav"><button id="prevDay">‹</button><button class="date-jump" id="dateJump">' + esc(state.date) + '</button><button id="nextDay">›</button>' +
    (state.date !== state.today ? '<button class="today-btn" id="todayBtn">Сегодня</button>' : '') + '</div>';
  if (!route.visits.length) {
    html += '<div class="empty">На ' + esc(state.date) + ' развоза нет</div>';
  } else {
    html += route.visits.map(function (v) {
      var done = v.status !== 'planned';
      var meta = [];
      if (v.address) meta.push(esc(v.address));
      if (v.has_clean) meta.push('✨ чистое: ' + v.clean_kg + ' кг / ' + v.clean_items + ' шт');
      if (v.has_dirty) meta.push('🧺 грязное в цеху');
      return '<div class="wcard' + (done ? ' done' : ' drv') + '"' + (done ? '' : ' data-open="' + v.id + '"') + '>' +
        '<div class="nm">' + esc(v.client_name) + '</div>' +
        (meta.length ? '<div class="cm">' + meta.join(' · ') + '</div>' : '') +
        (done ? '<div class="cm">' + (STATUS_LABELS[v.status] || v.status) + ' ✓</div>' : '') +
        '</div>';
    }).join('');
  }
  html += '</div>';
  document.getElementById('app').innerHTML = html;
  document.getElementById('prevDay').onclick = function () { loadDriver(shiftDateStr(state.date, -1)); };
  document.getElementById('nextDay').onclick = function () { loadDriver(shiftDateStr(state.date, 1)); };
  document.getElementById('dateJump').onclick = function () { openDateJump(loadDriver); };
  var todayBtn = document.getElementById('todayBtn');
  if (todayBtn) todayBtn.onclick = function () { loadDriver(state.today); };
  document.getElementById('logoutBtn').onclick = function () {
    api('logout', state.token).finally(backToPin);
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-open]'), function (el) {
    el.onclick = function () {
      var v = route.visits.filter(function (x) { return x.id === el.dataset.open; })[0];
      if (v) openDriverVisit(v);
    };
  });
}

// Диалог действий водителя: тап по карточке → крупные кнопки (защита от промахов).
function openDriverVisit(v) {
  var meta = [];
  if (v.address) meta.push(esc(v.address));
  if (v.has_clean) meta.push('✨ чистое: ' + v.clean_kg + ' кг / ' + v.clean_items + ' шт');
  if (v.has_dirty) meta.push('🧺 грязное в цеху');
  showDialog('<h2>' + esc(v.client_name) + '</h2>' +
    (meta.length ? '<div class="meta" style="margin-bottom:8px">' + meta.join(' · ') + '</div>' : '') +
    (v.has_clean ? '<div class="row"><button class="btn btn-primary btn-big" data-act="deliver">Выдал чистое</button></div>' : '') +
    '<div class="row"><button class="btn btn-primary btn-big" data-act="pickup">Забрал грязное</button></div>' +
    (v.has_clean ? '<div class="row"><button class="btn btn-primary btn-big" data-act="both">И то и другое</button></div>' : '') +
    '<div class="row"><button class="btn btn-ghost btn-big" data-act="empty">Ничего нет</button></div>' +
    '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Назад</button></div>');
  document.getElementById('dlgCancel').onclick = hideDialog;
  Array.prototype.forEach.call(document.querySelectorAll('[data-act]'), function (b) {
    b.onclick = function () {
      busy(b, '…');
      api('driverVisit', state.token, v.id, b.dataset.act)
        .then(function () { hideDialog(); toast('Отмечено ✓'); loadDriver(state.date); })
        .catch(function (e) { hideDialog(); toast(e.message, true); loadDriver(state.date); });
    };
  });
}

// ===== Экран владельца: вкладки =====
function ownerTabs(active) {
  if (state.role !== 'owner') return '';
  var tabs = [['day', 'Цех'], ['delivery', 'Развоз'], ['week', 'Неделя'], ['storage', 'Склад'], ['report', 'Отчёт'], ['refs', 'Справочники']];
  return '<div class="tabs">' + tabs.map(function (t) {
    return '<button data-view="' + t[0] + '"' + (t[0] === active ? ' class="active"' : '') + '>' + t[1] + '</button>';
  }).join('') + '</div>';
}
function bindTabs() {
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) {
    b.onclick = function () { navigate(b.dataset.view); };
  });
}
function navigate(view) {
  state.view = view;
  if (view === 'day') renderDay();
  else if (view === 'delivery') renderDelivery();
  else if (view === 'week') renderWeek();
  else if (view === 'storage') renderStorage();
  else if (view === 'report') renderReport(state.today);
  else if (view === 'refs') renderRefs();
}

function shiftDateStr(dateStr, days) {
  var p = dateStr.split('-').map(Number);
  var dt = new Date(Date.UTC(p[0], p[1] - 1, p[2]) + days * 86400000);
  return dt.getUTCFullYear() + '-' + ('0' + (dt.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + dt.getUTCDate()).slice(-2);
}

// Каркас экрана владельца: шапка + вкладки + контейнер
function appShell(title, tab, containerHtml, wide) {
  document.getElementById('app').innerHTML =
    '<div class="app-header"><h1>' + esc(title) + '</h1><div class="spacer"></div>' +
    '<button class="btn btn-ghost" id="logoutBtn">Выход</button></div>' +
    ownerTabs(tab) + '<div class="container' + (wide ? ' wide' : '') + '">' + containerHtml + '</div>';
  document.getElementById('logoutBtn').onclick = function () {
    api('logout', state.token).finally(backToPin);
  };
  bindTabs();
}
function setContainer(html) { document.querySelector('.container').innerHTML = html; }

// ===== Развоз (визиты) =====
function renderDelivery(date) {
  var tomorrow = shiftDateStr(state.today, 1);
  if (!date) date = tomorrow;
  appShell('Развоз', 'delivery', '<div class="empty">Загружаем…</div>');
  api('getDeliveryVisits', state.token, date).then(function (res) {
    var addrByClient = {};
    res.clients.forEach(function (c) { addrByClient[c.id] = c.address; });

    var html = '<div class="date-nav"><button id="dlPrev">‹</button>' +
      '<button class="date-jump" id="dlJump">' + esc(date) + '</button>' +
      '<button id="dlNext">›</button>' +
      (date !== tomorrow ? '<button class="today-btn" id="dlTomorrow">Завтра</button>' : '') + '</div>';

    if (res.notReady && res.notReady.length) {
      var REASONS = { washing_incomplete: 'стирка не завершена', partial: 'стирка частичная', no_clean: 'нет чистого белья' };
      html += '<div class="blockers"><b>⚠ Не готовы к развозу:</b>' + res.notReady.map(function (n) {
        return '<div class="brow">' + esc(n.client_name) + ' <span class="why">— ' + (REASONS[n.reason] || n.reason) + '</span></div>';
      }).join('') + '</div>';
    }

    html += '<h2>Визиты (' + res.visits.length + ')</h2>' +
      (res.visits.length ? res.visits.map(function (v) {
        var meta = [];
        if (addrByClient[v.client_id]) meta.push(esc(addrByClient[v.client_id]));
        if (v.has_clean) meta.push('✨ чистое: ' + v.clean_kg + ' кг / ' + v.clean_items + ' шт');
        if (v.has_dirty) meta.push('🧺 грязное в цеху');
        return '<div class="vrow"><div class="nm">' + esc(v.client_name) +
          (meta.length ? '<div class="cm">' + meta.join(' · ') + '</div>' : '') + '</div>' +
          (v.status === 'planned'
            ? '<button class="rm" data-rm="' + v.id + '" data-name="' + esc(v.client_name) + '" title="Убрать из развоза">✕</button>'
            : '<span class="chip chip-' + v.status + '">' + (STATUS_LABELS[v.status] || v.status) + '</span>') +
          '</div>';
      }).join('') : '<div class="empty">Развоз пуст — добавьте клиентов ниже или на «Неделе»</div>');

    var inDelivery = {};
    res.visits.forEach(function (v) { inDelivery[v.client_id] = 1; });
    var available = res.clients.filter(function (c) { return !inDelivery[c.id]; });
    html += '<h2>Добавить</h2>' +
      '<input class="search-input" id="dlSearch" placeholder="Начните вводить имя клиента…">' +
      '<div id="dlResults"></div>';
    setContainer(html);

    document.getElementById('dlPrev').onclick = function () { renderDelivery(shiftDateStr(date, -1)); };
    document.getElementById('dlNext').onclick = function () { renderDelivery(shiftDateStr(date, 1)); };
    document.getElementById('dlJump').onclick = function () { openDateJump(renderDelivery, date); };
    var dlTomorrow = document.getElementById('dlTomorrow');
    if (dlTomorrow) dlTomorrow.onclick = function () { renderDelivery(); };

    function renderResults() {
      var q = document.getElementById('dlSearch').value.trim().toLowerCase();
      var box = document.getElementById('dlResults');
      if (!q) { box.innerHTML = ''; return; }
      var found = available.filter(function (c) { return c.name.toLowerCase().indexOf(q) !== -1; });
      box.innerHTML = found.length ? found.map(function (c) {
        return '<div class="vrow"><div class="nm">' + esc(c.name) +
          '<div class="cm">' + esc(c.type) + (c.address ? ' · ' + esc(c.address) : '') +
          (c.storage === 'да' ? ' · складской клиент' : '') + '</div></div>' +
          '<button class="add" data-add="' + c.id + '" title="Добавить в развоз">+</button></div>';
      }).join('') : '<div class="empty" style="padding:16px 0">Никого не найдено</div>';
      Array.prototype.forEach.call(box.querySelectorAll('[data-add]'), function (b) {
        b.onclick = function () {
          busy(b, '…');
          api('addDeliveryVisit', state.token, b.dataset.add, date)
            .then(function () { toast('Добавлено в развоз ✓'); renderDelivery(date); })
            .catch(function (e) { unbusy(b); toast(e.message, true); });
        };
      });
    }
    document.getElementById('dlSearch').oninput = renderResults;

    Array.prototype.forEach.call(document.querySelectorAll('[data-rm]'), function (b) {
      b.onclick = function () {
        confirmDialog('Убрать «' + b.dataset.name + '» из развоза?', 'Убрать', function () {
          busy(document.getElementById('dlgOk'), '…');
          api('removeDeliveryVisit', state.token, b.dataset.rm)
            .then(function () { hideDialog(); toast('Убрано'); renderDelivery(date); })
            .catch(function (e) { hideDialog(); toast(e.message, true); });
        });
      };
    });
  }).catch(function (e) {
    setContainer('<div class="empty">Не удалось загрузить развоз: ' + esc(e.message) + '</div>' +
      '<button class="btn btn-primary btn-big" id="dlRetry">Повторить</button>');
    document.getElementById('dlRetry').onclick = function () { renderDelivery(date); };
  });
}

// ===== Неделя (канбан выдачи) =====
var WEEKDAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
function mondayOfStr(dateStr) {
  var p = dateStr.split('-').map(Number);
  var dow = new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay(); // 0=вс..6=сб
  return shiftDateStr(dateStr, -((dow + 6) % 7));
}
function renderWeek() {
  if (!state.weekMonday) state.weekMonday = mondayOfStr(state.today);
  appShell('Неделя', 'week', '<div class="empty">Загружаем…</div>', true);
  api('getWeekPlan', state.token, state.weekMonday).then(function (res) {
    state.weekMonday = res.monday;
    var html = '<div class="row" style="margin-top:0">' +
      '<button class="btn btn-ghost" id="wkPrev">‹</button>' +
      '<div style="text-align:center;font-weight:700;font-size:18px">' +
        res.days[0].date + ' — ' + res.days[6].date + '</div>' +
      '<button class="btn btn-ghost" id="wkNext">›</button></div>' +
      '<div class="week-board">' + res.days.map(function (d, i) {
        var cards = d.cards.map(function (c) {
          return '<div class="wcard" data-card="' + c.id + '">' +
            '<div class="nm">' + esc(c.client_name) + '</div>' +
            '<div class="cm">' + (STATUS_LABELS[c.status] || c.status) +
              (c.has_clean ? ' · ✨ чистое' : '') + (c.has_dirty ? ' · 🧺 грязное' : '') + '</div></div>';
        }).join('');
        return '<div class="week-col' + (d.date === state.today ? ' today' : '') + '">' +
          '<h3>' + WEEKDAYS[i] + ' ' + d.date.slice(5) + '</h3>' + cards +
          '<button class="week-add" data-addday="' + d.date + '">+</button></div>';
      }).join('') + '</div>';
    setContainer(html);
    document.getElementById('wkPrev').onclick = function () { state.weekMonday = shiftDateStr(res.monday, -7); renderWeek(); };
    document.getElementById('wkNext').onclick = function () { state.weekMonday = shiftDateStr(res.monday, 7); renderWeek(); };
    Array.prototype.forEach.call(document.querySelectorAll('[data-addday]'), function (b) {
      b.onclick = function () {
        var day = res.days.filter(function (d) { return d.date === b.dataset.addday; })[0];
        openWeekAdd(b.dataset.addday, res.clients, day ? day.cards : []);
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-card]'), function (el) {
      el.onclick = function () {
        var found = null;
        res.days.forEach(function (d) {
          d.cards.forEach(function (x) { if (x.id === el.dataset.card) found = x; });
        });
        if (found) openWeekCard(found, res.days);
      };
    });
  }).catch(function (e) { setContainer('<div class="empty">' + esc(e.message) + '</div>'); });
}

function openWeekAdd(date, clients, cards) {
  if (!clients.length) return toast('Сначала добавьте клиента в Справочниках');
  var inDay = {};
  (cards || []).forEach(function (c) { inDay[c.client_id] = true; });
  showDialog('<h2>Развоз ' + date + '</h2>' +
    '<div class="meta" style="margin-bottom:6px">Отметьте клиентов (можно несколько):</div>' +
    '<div style="max-height:50vh;overflow-y:auto">' + clients.map(function (c) {
      var taken = inDay[c.id];
      return '<div class="row"><label style="font-size:16px' + (taken ? ';color:#98a2b3' : '') + '">' +
        '<input type="checkbox" class="wcPick" value="' + c.id + '"' + (taken ? ' disabled' : '') + '> ' +
        esc(c.name) + (taken ? ' — уже в развозе' : '') + '</label></div>';
    }).join('') + '</div>' +
    '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Назад</button>' +
    '<button class="btn btn-primary" id="dlgOk">Добавить выбранных</button></div>');
  document.getElementById('dlgCancel').onclick = hideDialog;
  var okBtn = document.getElementById('dlgOk');
  okBtn.onclick = function () {
    var ids = Array.prototype.map.call(document.querySelectorAll('.wcPick:checked'), function (b) { return b.value; });
    if (!ids.length) return toast('Отметьте хотя бы одного клиента');
    busy(okBtn, 'Сохраняем…');
    // Добавляем последовательно, чтобы не гонять запросы параллельно
    var chain = Promise.resolve();
    ids.forEach(function (cid) {
      chain = chain.then(function () { return api('addWeekCard', state.token, cid, date); });
    });
    chain.then(function () { hideDialog(); toast('Добавлено: ' + ids.length + ' ✓'); renderWeek(); })
      .catch(function (e) { hideDialog(); toast(e.message, true); renderWeek(); });
  };
}

function openWeekCard(c, days) {
  if (c.status !== 'planned') {
    showDialog('<h2>' + esc(c.client_name) + '</h2>' +
      '<div class="meta">Статус: ' + (STATUS_LABELS[c.status] || c.status) +
      ' — перенос и удаление недоступны</div>' +
      '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Назад</button></div>');
    document.getElementById('dlgCancel').onclick = hideDialog;
    return;
  }
  showDialog('<h2>' + esc(c.client_name) + '</h2>' +
    '<div class="meta" style="margin-bottom:8px">Перенести визит на:</div>' +
    '<div class="row" style="flex-wrap:wrap">' + days.map(function (d, i) {
      return '<button class="btn btn-ghost" data-mv="' + d.date + '"' +
        (d.date === c.date ? ' disabled' : '') + '>' + WEEKDAYS[i] + ' ' + d.date.slice(5) + '</button>';
    }).join('') + '</div>' +
    '<div class="actions"><button class="btn btn-danger" id="wcDel">Убрать</button>' +
    '<button class="btn btn-ghost" id="dlgCancel">Назад</button></div>');
  document.getElementById('dlgCancel').onclick = hideDialog;
  Array.prototype.forEach.call(document.querySelectorAll('[data-mv]'), function (b) {
    b.onclick = function () {
      busy(b, '…');
      api('moveWeekCard', state.token, c.id, b.dataset.mv)
        .then(function () { hideDialog(); toast('Перенесено ✓'); renderWeek(); })
        .catch(function (e) { hideDialog(); toast(e.message, true); });
    };
  });
  document.getElementById('wcDel').onclick = function () {
    confirmDialog('Убрать карточку «' + c.client_name + '» из недели?', 'Убрать', function () {
      api('removeWeekCard', state.token, c.id)
        .then(function () { hideDialog(); toast('Убрано'); renderWeek(); })
        .catch(function (e) { hideDialog(); toast(e.message, true); });
    });
  };
}

// ===== Склад =====
// Единые карточки во всех секциях; детали и кнопки — по тапу на карточку.
function renderStorage() {
  appShell('Склад', 'storage', '<div class="empty">Загружаем…</div>');
  api('getStorage', state.token).then(function (res) {
    var types = {};
    (res.itemTypes || []).forEach(function (t) { types[t.id] = t.name; });

    // Чистое бельё: stored-стирки + чистое полностью завершённых (done) —
    // оно сразу идёт на склад на хранение.
    var clean = [];
    res.stored.forEach(function (w) {
      clean.push({ kind: 'clean', id: w.id, client_name: w.client_name,
        kg: w.dirty_weight_kg, total: w.items_total, bags: Number(w.bags) || 0, items: w.items || [], issue_date: w.issue_date });
    });
    (res.cleanReady || []).forEach(function (s) {
      clean.push({ kind: 'clean', id: s.wash_id, client_name: s.client_name,
        kg: s.weight_kg, total: s.items_total, bags: Number(s.bags) || 0, items: [], issue_date: s.issue_date || '' });
    });
    clean.sort(function (a, b) { return a.issue_date < b.issue_date ? -1 : 1; });

    var partial = (res.partialClean || []).map(function (s) {
      return { kind: 'partial', id: s.id, client_name: s.client_name,
        kg: s.weight_kg, total: s.items_total, bags: Number(s.bags) || 0, since: (s.created_at || '').slice(0, 10) };
    });
    var dirty = (res.dirty || []).map(function (s) {
      return { kind: 'dirty', id: s.id, client_name: s.client_name,
        since: (s.created_at || '').slice(0, 10) };
    });

    function metaOf(e) {
      if (e.kind === 'dirty') return '🧺 Принято: ' + esc(e.since) + ' · ждёт стирки';
      var m = (e.kg || 0) + ' кг · ' + (e.total || 0) + ' шт' + (e.bags > 0 ? ' · ' + e.bags + ' меш.' : '');
      if (e.kind === 'partial') return m + ' · с ' + esc(e.since);
      var overdue = e.issue_date && e.issue_date < state.today;
      return m + ' · Выдача: <b>' + esc(e.issue_date) + '</b>' +
        (overdue ? ' · <span class="overdue">просрочена!</span>' : '');
    }
    function cardsHtml(list, cls) {
      return list.map(function (e, i) {
        return '<div class="wcard st ' + cls + '" data-sec="' + e.kind + '" data-i="' + i + '">' +
          '<div class="nm">' + esc(e.client_name) + '</div>' +
          '<div class="cm">' + metaOf(e) + '</div></div>';
      }).join('');
    }

    setContainer(
      '<input class="search-input" id="stSearch" placeholder="Поиск по клиенту…">' +
      '<h1>Чистое бельё</h1>' + (cardsHtml(clean, 'st-clean') || '<div class="empty">Чистого белья нет</div>') +
      (partial.length ? '<h1 style="margin-top:16px">Остатки частичных стирок</h1>' + cardsHtml(partial, 'st-partial') : '') +
      '<h1 style="margin-top:16px">Грязное бельё</h1>' + (cardsHtml(dirty, 'st-dirty') || '<div class="empty">Грязного белья нет</div>'));

    document.getElementById('stSearch').oninput = function () {
      var q = this.value.trim().toLowerCase();
      Array.prototype.forEach.call(document.querySelectorAll('[data-sec]'), function (c) {
        var nm = c.querySelector('.nm').textContent.toLowerCase();
        c.style.display = !q || nm.indexOf(q) !== -1 ? '' : 'none';
      });
    };

    var bySec = { clean: clean, partial: partial, dirty: dirty };
    Array.prototype.forEach.call(document.querySelectorAll('[data-sec]'), function (el) {
      el.onclick = function () {
        openStorageCard(bySec[el.dataset.sec][Number(el.dataset.i)], types);
      };
    });
  }).catch(function (e) { setContainer('<div class="empty">' + esc(e.message) + '</div>'); });
}

// Диалог карточки склада: подробности + действия (для чистого — «Выдано», «Изменить дату»)
function openStorageCard(e, types) {
  var html = '<h2>' + esc(e.client_name) + '</h2>';
  if (e.kind === 'dirty') {
    html += '<div class="meta">🧺 Грязное бельё, принято: <b>' + esc(e.since) + '</b></div>' +
      '<div class="meta">Вес и количество появятся после стирки.</div>' +
      '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Назад</button></div>';
  } else if (e.kind === 'partial') {
    html += '<div class="meta">Обработано частично: <b>' + (e.kg || 0) + ' кг · ' + (e.total || 0) + ' шт' +
      (e.bags > 0 ? ' · ' + e.bags + ' меш.' : '') + '</b></div>' +
      '<div class="meta">На складе с ' + esc(e.since) + '. Клиент НЕ готов к развозу — вернуть в стирку решает владелец.</div>' +
      '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Назад</button></div>';
  } else {
    var positions = (e.items || []).map(function (it) {
      return esc(types[it.item_type_id] || it.item_type_id) + ' ×' + it.qty;
    }).join(', ');
    var overdue = e.issue_date && e.issue_date < state.today;
    html += '<div class="meta"><b>' + (e.kg || 0) + ' кг · ' + (e.total || 0) + ' шт' +
      (e.bags > 0 ? ' · ' + e.bags + ' меш.' : '') + '</b></div>' +
      (positions ? '<div class="meta">' + positions + '</div>' : '') +
      '<div class="meta">Выдача: <b>' + esc(e.issue_date) + '</b>' +
      (overdue ? ' · <span class="overdue">просрочена!</span>' : '') + '</div>' +
      '<div class="row"><button class="btn btn-primary btn-big" id="stIssue">Выдано</button></div>' +
      '<div class="row"><button class="btn btn-ghost btn-big" id="stEditDate">Изменить дату</button></div>' +
      '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Назад</button></div>';
  }
  showDialog(html);
  document.getElementById('dlgCancel').onclick = hideDialog;

  var issueBtn = document.getElementById('stIssue');
  if (issueBtn) issueBtn.onclick = function () {
    confirmDialog('Отметить выдачу клиенту «' + e.client_name + '»?', 'Выдано', function () {
      busy(document.getElementById('dlgOk'), 'Сохраняем…');
      api('markIssued', state.token, e.id)
        .then(function () { hideDialog(); toast('Выдано ✓'); renderStorage(); })
        .catch(function (err) { hideDialog(); toast(err.message, true); });
    });
  };
  var editBtn = document.getElementById('stEditDate');
  if (editBtn) editBtn.onclick = function () {
    showDialog('<h2>Дата выдачи</h2>' +
      '<div class="row"><input type="date" id="newIssue" value="' + esc(e.issue_date) + '"></div>' +
      '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Назад</button>' +
      '<button class="btn btn-primary" id="dlgOk">Сохранить</button></div>');
    document.getElementById('dlgCancel').onclick = hideDialog;
    var okBtn = document.getElementById('dlgOk');
    okBtn.onclick = function () {
      busy(okBtn, 'Сохраняем…');
      api('updateIssueDate', state.token, e.id, document.getElementById('newIssue').value)
        .then(function () { hideDialog(); toast('Дата обновлена ✓'); renderStorage(); })
        .catch(function (err) { hideDialog(); toast(err.message, true); });
    };
  };
}

// ===== Отчёт за день =====
function renderReport(date) {
  appShell('Отчёт за день', 'report', '<div class="empty">Загружаем…</div>');
  api('getDayReport', state.token, date).then(function (res) {
    var r = res.report;
    var html = '<div class="card"><div class="row" style="margin-top:0">' +
      '<button class="btn btn-ghost" id="repPrev">‹</button>' +
      '<div style="text-align:center;font-weight:700;font-size:20px">' +
      '<button class="date-jump" id="repJump" style="font-size:20px">' + esc(r.date) + '</button></div>' +
      '<button class="btn btn-ghost" id="repNext">›</button></div>' +
      (r.date !== state.today ? '<div class="row"><button class="today-btn" id="repToday" style="flex:none">Сегодня</button></div>' : '') +
      '<div class="summary" style="margin-top:12px">' +
      '<span class="chip chip-done">' + r.totalKg + ' кг</span>' +
      '<span class="chip chip-done">Завершено: ' + r.washesDone + '</span>' +
      '<span class="chip chip-deferred">Перенесено: ' + r.deferred + '</span>' +
      '<span class="chip chip-planned">Отменено: ' + r.cancelled + '</span>' +
      '<span class="chip chip-stored">На складе: ' + r.stored + '</span>' +
      '<span class="chip chip-planned">Выдано: ' + r.issued + '</span>' +
      (res.shift ? '<span class="chip ' + (res.shift.status === 'closed' ? 'chip-done' : 'chip-in_progress') + '">Смена: ' +
        (res.shift.status === 'closed' ? 'закрыта в ' + esc(res.shift.closed_at) : 'открыта') + '</span>' : '') +
      '</div></div>';

    // Завершённые и прочие сверху, незавершённые — внизу (spec §7.3)
    var rows = res.washes.slice().sort(function (a, b) {
      var openA = a.status === 'planned' || a.status === 'in_progress' ? 1 : 0;
      var openB = b.status === 'planned' || b.status === 'in_progress' ? 1 : 0;
      return openA - openB;
    });
    html += rows.length ? '<table class="report"><tr><th>Клиент</th><th>Кг</th><th>Позиции</th><th>Шт</th><th>Статус</th><th></th></tr>' +
      rows.map(function (w) {
        var items = w.items || [];
        var positions = items.length
          ? '<details class="pos"><summary>▸ ' + items.length + ' поз.</summary><div class="pos-list">' +
            items.map(function (it) { return '<div>' + esc(it.item_name) + ' ×' + it.qty + '</div>'; }).join('') +
            '</div></details>'
          : '—';
        var canEdit = w.status === 'done' || w.status === 'stored' || w.status === 'partial';
        return '<tr><td>' + esc(w.client_name) +
          (w.deferred_from ? '<br><span class="chip chip-deferred">с ' + esc(w.deferred_from) + '</span>' : '') + '</td>' +
          '<td>' + (w.dirty_weight_kg || '—') + '</td><td>' + positions + '</td>' +
          '<td>' + (w.items_total || '—') + (Number(w.bags) > 0 ? ' · ' + w.bags + ' меш.' : '') + '</td>' +
          '<td>' + (STATUS_LABELS[w.status] || w.status) + '</td>' +
          '<td>' + (canEdit ? '<button class="btn btn-ghost" data-edit="' + w.id + '">Изменить</button>' : '') + '</td></tr>';
      }).join('') + '</table>' : '<div class="empty">Стирок не было</div>';
    setContainer(html);

    document.getElementById('repPrev').onclick = function () { renderReport(shiftDateStr(date, -1)); };
    document.getElementById('repNext').onclick = function () { renderReport(shiftDateStr(date, 1)); };
    document.getElementById('repJump').onclick = function () { openDateJump(renderReport, date); };
    var repToday = document.getElementById('repToday');
    if (repToday) repToday.onclick = function () { renderReport(state.today); };
    Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'), function (b) {
      b.onclick = function () {
        var w = res.washes.find(function (x) { return x.id === b.dataset.edit; });
        openEditDialog(w, function () { renderReport(date); });
      };
    });
  }).catch(function (e) { setContainer('<div class="empty">' + esc(e.message) + '</div>'); });
}

// Правка веса/пересчёта завершённой из отчёта (spec §7.3)
function openEditDialog(w, onSaved) {
  var types = (state.day && state.day.itemTypes) || [];
  var counts = {};
  (w.items || []).forEach(function (it) { counts[it.item_type_id] = it.qty; });
  showDialog('<h2>Изменить данные: ' + esc(w.client_name) + '</h2>' +
    '<div class="row"><span>Вес, кг</span><input type="number" inputmode="decimal" step="0.1" min="0" id="editWeight" value="' + (w.dirty_weight_kg || 0) + '"></div>' +
    '<div class="row"><span>Мешков</span><input type="number" inputmode="numeric" step="1" min="0" id="editBags" value="' + (w.bags || 0) + '"></div>' +
    types.map(function (t) {
      return '<div class="item-row"><span class="name">' + esc(t.name) + '</span>' +
        '<div class="stepper"><button data-t="' + t.id + '" data-d="-1">−</button>' +
        '<span class="val" id="eq_' + t.id + '">' + (counts[t.id] || 0) + '</span>' +
        '<button data-t="' + t.id + '" data-d="1">+</button></div></div>';
    }).join('') +
    '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Назад</button>' +
    '<button class="btn btn-primary" id="dlgOk">Сохранить</button></div>');
  document.getElementById('dlgCancel').onclick = hideDialog;
  Array.prototype.forEach.call(document.querySelectorAll('#dialog [data-t]'), function (b) {
    b.onclick = function () {
      var q = Math.max(0, (counts[b.dataset.t] || 0) + parseInt(b.dataset.d, 10));
      counts[b.dataset.t] = q;
      document.getElementById('eq_' + b.dataset.t).textContent = q;
    };
  });
  var okBtn = document.getElementById('dlgOk');
  okBtn.onclick = function () {
    busy(okBtn, 'Сохраняем…');
    var items = Object.keys(counts).filter(function (k) { return counts[k] > 0; })
      .map(function (k) { return { item_type_id: k, qty: counts[k] }; });
    var kg = parseFloat(document.getElementById('editWeight').value) || 0;
    var bags = parseInt(document.getElementById('editBags').value, 10) || 0;
    api('editWashData', state.token, w.id, kg, items, bags)
      .then(function () { hideDialog(); toast('Данные обновлены ✓'); onSaved(); })
      .catch(function (e) { hideDialog(); toast(e.message, true); });
  };
}

// ===== Справочники =====
function renderRefs() {
  appShell('Справочники', 'refs', '<div class="empty">Загружаем…</div>');
  api('getRefs', state.token).then(function (res) {
    var html = '<h2>Клиенты</h2>' + res.clients.map(function (c) {
      var inactive = c.active !== 'да';
      return '<div class="card"' + (inactive ? ' style="opacity:.55"' : '') + '>' +
        '<div class="client">' + esc(c.name) + (inactive ? ' (архив)' : '') + '</div>' +
        '<div class="meta">' + esc(c.type) + (c.storage === 'да' ? ' · склад' : '') +
        (c.contact ? ' · ' + esc(c.contact) : '') + (c.address ? ' · ' + esc(c.address) : '') + '</div>' +
        (c.comment ? '<div class="meta">💬 ' + esc(c.comment) + '</div>' : '') +
        '<div class="row"><button class="btn btn-ghost" data-cedit="' + c.id + '">Изменить</button>' +
        (!inactive ? '<button class="btn btn-danger" data-carch="' + c.id + '">В архив</button>' : '') +
        '</div></div>';
    }).join('') +
    '<div class="row"><button class="btn btn-primary btn-big" id="addClientBtn">+ Добавить клиента</button></div>';

    html += '<h2>Типы белья</h2>' + res.itemTypes.map(function (t) {
      var inactive = t.active !== 'да';
      return '<div class="item-row"' + (inactive ? ' style="opacity:.55"' : '') + '>' +
        '<span class="name">' + esc(t.sort) + '. ' + esc(t.name) + (inactive ? ' (выкл)' : '') + '</span>' +
        '<button class="btn btn-ghost" data-tedit="' + t.id + '">Переименовать</button>' +
        '<button class="btn btn-ghost" data-ttoggle="' + t.id + '" data-active="' + esc(t.active) + '">' +
        (inactive ? 'Включить' : 'Выключить') + '</button></div>';
    }).join('') +
    '<div class="row"><button class="btn btn-primary btn-big" id="addTypeBtn">+ Добавить тип</button></div>';
    setContainer(html);

    document.getElementById('addClientBtn').onclick = function () { openClientForm(null); };
    Array.prototype.forEach.call(document.querySelectorAll('[data-cedit]'), function (b) {
      b.onclick = function () {
        openClientForm(res.clients.find(function (c) { return c.id === b.dataset.cedit; }));
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-carch]'), function (b) {
      b.onclick = function () {
        busy(b, 'Архивируем…');
        api('deleteClient', state.token, b.dataset.carch)
          .then(function () { toast('Клиент в архиве'); renderRefs(); })
          .catch(function (e) { unbusy(b); toast(e.message, true); });
      };
    });
    document.getElementById('addTypeBtn').onclick = function () { openTypeForm(null); };
    Array.prototype.forEach.call(document.querySelectorAll('[data-tedit]'), function (b) {
      b.onclick = function () {
        openTypeForm(res.itemTypes.find(function (t) { return t.id === b.dataset.tedit; }));
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-ttoggle]'), function (b) {
      b.onclick = function () {
        busy(b, 'Сохраняем…');
        api('saveItemType', state.token, { id: b.dataset.ttoggle, active: b.dataset.active === 'да' ? 'нет' : 'да' })
          .then(function () { renderRefs(); })
          .catch(function (e) { unbusy(b); toast(e.message, true); });
      };
    });
  }).catch(function (e) { setContainer('<div class="empty">' + esc(e.message) + '</div>'); });
}

function openClientForm(c) {
  c = c || {};
  showDialog('<h2>' + (c.id ? 'Изменить клиента' : 'Новый клиент') + '</h2>' +
    '<div class="row"><input type="text" id="cfName" placeholder="Название" value="' + esc(c.name || '') + '"></div>' +
    '<div class="row"><input type="text" id="cfContact" placeholder="Контакт" value="' + esc(c.contact || '') + '"></div>' +
    '<div class="row"><input type="text" id="cfAddress" placeholder="Адрес" value="' + esc(c.address || '') + '"></div>' +
    '<div class="row"><select id="cfType">' +
      ['отель', 'ресторан', 'спа', 'прочее'].map(function (t) {
        return '<option' + (c.type === t ? ' selected' : '') + '>' + t + '</option>';
      }).join('') + '</select>' +
    '<select id="cfStorage">' +
      '<option value="нет"' + (c.storage !== 'да' ? ' selected' : '') + '>без склада</option>' +
      '<option value="да"' + (c.storage === 'да' ? ' selected' : '') + '>складской</option>' +
    '</select></div>' +
    '<div class="row"><input type="text" id="cfComment" placeholder="Комментарий" value="' + esc(c.comment || '') + '"></div>' +
    '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Назад</button>' +
    '<button class="btn btn-primary" id="dlgOk">Сохранить</button></div>');
  document.getElementById('dlgCancel').onclick = hideDialog;
  var okBtn = document.getElementById('dlgOk');
  okBtn.onclick = function () {
    var name = document.getElementById('cfName').value.trim();
    if (!name) return toast('Укажите название');
    busy(okBtn, 'Сохраняем…');
    var payload = {
      name: name,
      contact: document.getElementById('cfContact').value,
      address: document.getElementById('cfAddress').value,
      type: document.getElementById('cfType').value,
      storage: document.getElementById('cfStorage').value,
      comment: document.getElementById('cfComment').value
    };
    if (c.id) payload.id = c.id;
    api('saveClient', state.token, payload)
      .then(function () { hideDialog(); toast('Сохранено ✓'); renderRefs(); })
      .catch(function (e) { hideDialog(); toast(e.message, true); });
  };
}

function openTypeForm(t) {
  showDialog('<h2>' + (t ? 'Переименовать тип' : 'Новый тип белья') + '</h2>' +
    '<div class="row"><input type="text" id="tfName" placeholder="Название" value="' + esc(t ? t.name : '') + '"></div>' +
    '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Назад</button>' +
    '<button class="btn btn-primary" id="dlgOk">Сохранить</button></div>');
  document.getElementById('dlgCancel').onclick = hideDialog;
  var okBtn = document.getElementById('dlgOk');
  okBtn.onclick = function () {
    var name = document.getElementById('tfName').value.trim();
    if (!name) return toast('Укажите название');
    busy(okBtn, 'Сохраняем…');
    var payload = { name: name };
    if (t) payload.id = t.id;
    api('saveItemType', state.token, payload)
      .then(function () { hideDialog(); toast('Сохранено ✓'); renderRefs(); })
      .catch(function (e) { hideDialog(); toast(e.message, true); });
  };
}

// ===== Диалог =====
function showDialog(html) {
  document.getElementById('dialog').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
}
function hideDialog() { document.getElementById('overlay').classList.remove('show'); }

// ===== Старт =====
if (state.token) {
  // Восстановление сессии: дата всегда с сервера; у водителя свой экран
  if (state.role === 'driver') {
    api('getDriverRoute', state.token, '').then(function (res) {
      state.date = res.date; state.today = res.date; state.route = res; renderDriver();
    }).catch(function () { renderPin(); });
  } else {
    api('getDayList', state.token, '').then(function (res) {
      state.date = res.date; state.today = res.date; state.day = res; renderDay();
    }).catch(function () {
      renderPin();
    });
  }
} else {
  renderPin();
}
</script>
