<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleanLab Pro — табло</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== ТВ-табло: палитра дизайн-системы «CleanLab Pro SaaS» =====
       Цвета — через переменные; тёмная тема по умолчанию, светлая — html[data-theme="light"]
       (?theme=light, клавиша 't'). Inter + JetBrains Mono. */
    :root {
      --bg: #0b0e14; --surface: #12151c; --border: #232833; --text: #e5e9f0; --muted: #9aa4b2;
      --chip-amber: #f0a94f; --chip-blue: #7ba4f8; --chip-green: #4ade80; --chip-gray: #a8b6c7;
    }
    html[data-theme="light"] {
      --bg: #f1f5f9; --surface: #ffffff; --border: #e2e8f0; --text: #1e293b; --muted: #64748b;
      --chip-amber: #b45309; --chip-blue: #1d4ed8; --chip-green: #15803d; --chip-gray: #475569;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    header { display: flex; align-items: baseline; gap: 3vw; padding: 1.5vh 2vw; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 4.5vh; font-weight: 800; letter-spacing: -.02em; }
    header .date { font-size: 3.5vh; color: var(--muted); font-family: 'JetBrains Mono', monospace; font-weight: 600; }
    header .clock { margin-left: auto; font-size: 5vh; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    header .fresh { font-size: 2.5vh; color: var(--muted); }

    .counters { display: flex; gap: 1.2vw; padding: 1.5vh 2vw; flex-wrap: wrap; }
    .counter { background: var(--surface); border: 1px solid var(--border); border-radius: 1.5vh; padding: 1.5vh 2vw; text-align: center; flex: 1; min-width: 12vw; }
    .counter .num { font-size: 6vh; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    .counter .lbl { font-size: 2.4vh; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(30vw, 1fr)); gap: 1.5vw; padding: 0 2vw 2vh; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 1.5vh; padding: 2vh 2vw; border-left: 1.2vh solid #64748b; }
    .card .client { font-size: 4vh; font-weight: 800; letter-spacing: -.01em; }
    .card .meta { font-size: 2.8vh; color: var(--muted); margin-top: .8vh; font-family: 'JetBrains Mono', monospace; font-weight: 600; }
    .card .comment { font-size: 2.2vh; color: var(--muted); margin-top: .6vh; }
    .chip { display: inline-block; padding: .4vh 1.2vw; border-radius: .8vh; font-size: 2.2vh; font-weight: 700; margin-top: 1vh; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: .06em; }
    /* Цвета статусов совпадают с веб-приложением (light → dark адаптация тех же hue):
       planned/partial — янтарь, in_progress/stored — синий, done/ready_clean — зелёный,
       no_linen — янтарь с пульсацией чипа (заметность на табло). Текст чипа — через --chip-* (светлее в тёмной теме). */
    .st-planned { border-left-color: #d97706; } .st-planned .chip { background: rgba(217,119,6,.22); color: var(--chip-amber); }
    .st-in_progress { border-left-color: #2563eb; } .st-in_progress .chip { background: rgba(37,99,235,.25); color: var(--chip-blue); }
    .st-done { border-left-color: #16a34a; } .st-done .chip { background: rgba(22,163,74,.22); color: var(--chip-green); }
    .st-stored { border-left-color: #2563eb; } .st-stored .chip { background: rgba(37,99,235,.25); color: var(--chip-blue); }
    /* no_linen — янтарь с пульсацией, чтобы карточка выделялась на табло в колонке «Готово» */
    .st-no_linen { border-left-color: #d97706; background: rgba(217,119,6,.18); }
    .st-no_linen .chip { background: #d97706; color: #fff; animation: noLinenPulse 2s ease-in-out infinite; }
    @keyframes noLinenPulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    .st-ready_clean { border-left-color: #16a34a; } .st-ready_clean .chip { background: rgba(22,163,74,.22); color: var(--chip-green); }
    .st-partial { border-left-color: #d97706; } .st-partial .chip { background: rgba(217,119,6,.22); color: var(--chip-amber); }
    .chip-deferred { background: rgba(217,119,6,.22); color: var(--chip-amber); }

    .offline { display: none; position: fixed; top: 0; left: 0; right: 0; background: #dc2626; color: #fff;
      text-align: center; font-size: 3vh; font-weight: 700; padding: 1.5vh; z-index: 10; }
    .offline.show { display: block; }
    .empty { grid-column: 1/-1; text-align: center; color: var(--muted); font-size: 4vh; padding: 8vh 0; }

    /* Переключатель вида: списком / по строкам (как на вкладке «Стирка» в приложении) */
    .view-toggle { display: inline-flex; gap: .5vw; margin-left: 1vw; }
    .view-toggle button { border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: .8vh;
      padding: .6vh 1vw; font-size: 2.2vh; font-weight: 600; cursor: pointer; font-family: inherit; }
    .view-toggle button.on { background: #2563eb; border-color: #2563eb; color: #fff; }

    /* Вид «списком»: колонки-списки по статусам, как в приложении */
    .cols { display: flex; gap: 1.5vw; padding: 0 2vw 2vh; align-items: flex-start; }
    .cols .col { flex: 1; min-width: 0; }
    .cols .col h2 { font-size: 3vh; color: var(--muted); text-transform: uppercase; letter-spacing: .05em;
      padding: 0 0 1.2vh; border-bottom: 1px solid var(--border); margin-bottom: 1.5vh; }
    .cols .card { margin-bottom: 1.5vh; }
    .cols .col-empty { text-align: center; color: var(--muted); font-size: 2.6vh; padding: 2vh 0; }

    /* Вид «по строкам»: клиент держит свою строку, карточка «переезжает» по горизонтали */
    .rows-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5vw; padding: 0 2vw 2vh; }
    .rows-board .col-head { font-size: 3vh; color: var(--muted); text-transform: uppercase; letter-spacing: .05em;
      padding: 0 0 1.2vh; border-bottom: 1px solid var(--border); }
    .card.ghost { background: transparent; border-left-color: transparent; outline: 1px dashed var(--border); opacity: .6; }
    .card.ghost .client { font-weight: 400; color: var(--muted); }
    .card.ghost .arrow { font-size: 2.2vh; color: var(--muted); margin-top: .8vh; }

    /* #stage — обёртка для зума (?zoom=0.8, клавиши +/-/0) и поворота (?rotate=1 / -1) */
    #stage { transform-origin: top left; }
    /* Повёрнутый режим: сцена имеет фиксированную высоту (= ширине экрана), поэтому
       не влезшее содержимое скроллится внутри самой сцены. Скролл идёт по локальной
       оси элемента, после поворота на 90° он визуально вертикален на экране — колесо
       мыши и тач работают нативно. Полосу прокрутки прячем (на ТВ она не нужна). */
    #stage.scrollable { overflow-y: auto; scrollbar-width: none; overscroll-behavior: contain; }
    #stage.scrollable::-webkit-scrollbar { display: none; }
    /* Шапка прилипает к верху при прокрутке (и в обычном, и в повёрнутом режиме) */
    header { position: sticky; top: 0; background: var(--bg); z-index: 5; }
  </style>
<base target="_blank">
</head>
<body>
  <div class="offline" id="offline">Нет связи — показаны данные на <span id="offlineTime"></span></div>
  <div id="stage">
  <header>
    <h1 id="laundryName">CleanLab Pro</h1>
    <div class="date" id="date"></div>
    <div class="clock" id="clock"></div>
    <div class="fresh" id="fresh"></div>
    <div class="view-toggle">
      <button id="viewListBtn" title="Списки по колонкам">☰ Списком</button>
      <button id="viewRowsBtn" title="Клиент держит свою строку">⇄ По строкам</button>
      <button id="themeBtn" title="Тёмная/светлая тема (клавиша 't')"></button>
    </div>
  </header>
  <div class="counters" id="counters"></div>
  <div class="grid" id="grid"></div>
  </div>

<script>
// Адаптер google.script.run → fetch('/api/<method>') с тем же интерфейсом
// (withSuccessHandler/withFailureHandler). Тело запроса: { args: [...] }.
var google = {
  script: {
    run: (function () {
      var handlers = {};
      var runner = new Proxy({}, {
        get: function (target, prop) {
          if (prop === 'withSuccessHandler') return function (f) { handlers.success = f; return runner; };
          if (prop === 'withFailureHandler') return function (f) { handlers.failure = f; return runner; };
          if (typeof prop !== 'string') return undefined;
          return function () {
            var h = { success: handlers.success, failure: handlers.failure };
            handlers = {};
            fetch('/api/' + prop, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ args: Array.prototype.slice.call(arguments) })
            }).then(function (r) {
              if (!r.ok) return r.json().then(function (b) { throw new Error((b && b.error) || ('HTTP ' + r.status)); });
              return r.json();
            }).then(function (res) {
              if (h.success) h.success(res);
            }).catch(function (e) {
              if (h.failure) h.failure(e);
            });
          };
        }
      });
      return runner;
    })()
  }
};
var KEY = new URLSearchParams(location.search).get('key') || '';

// Масштаб и поворот табло (размеры в vh/vw, поэтому зум браузера не работает —
// масштабируем сами через transform). Параметры запоминаются в localStorage:
//   ?zoom=0.8   — масштаб (клавиши: '+' увеличить, '-' уменьшить, '0' сброс)
//   ?rotate=1   — повернуть на 90° по часовой (ТВ стоит вертикально), ?rotate=-1 — против
//   ?theme=light — светлая тема (по умолчанию тёмная; клавиша 't' — переключить)
var params = new URLSearchParams(location.search);
var zoom = parseFloat(params.get('zoom')) || parseFloat(localStorage.getItem('cl_tv_zoom')) || 1;
var rotate = params.get('rotate') != null ? parseInt(params.get('rotate'), 10) || 0
  : parseInt(localStorage.getItem('cl_tv_rotate'), 10) || 0;
var theme = params.get('theme') === 'light' || params.get('theme') === 'dark' ? params.get('theme')
  : localStorage.getItem('cl_tv_theme') || 'dark';

function applyTheme() {
  document.documentElement.dataset.theme = theme;
  localStorage.setItem('cl_tv_theme', theme);
  document.getElementById('themeBtn').textContent = theme === 'dark' ? '☀ Светлая' : '☾ Тёмная';
}
applyTheme();
document.getElementById('themeBtn').onclick = function () {
  theme = theme === 'dark' ? 'light' : 'dark';
  applyTheme();
};

function applyTransform() {
  var stage = document.getElementById('stage');
  if (rotate) {
    // Вьюпорт остаётся «ландшафтным» (ОС не повёрнута): ширина сцены = высоте экрана и наоборот
    stage.style.width = (100 / zoom) + 'vh';
    stage.style.height = (100 / zoom) + 'vw';
    stage.style.transform = (rotate > 0 ? 'translateX(100vw) rotate(90deg) ' : 'translateY(100vh) rotate(-90deg) ') +
      'scale(' + zoom + ')';
    // Высота сцены зафиксирована → всё, что не влезло, доступно прокруткой сцены;
    // саму страницу при этом не скроллим (иначе повёрнутая сцена «уезжает»).
    stage.classList.add('scrollable');
    document.body.style.overflow = 'hidden';
  } else {
    stage.style.width = (100 / zoom) + 'vw';
    stage.style.height = '';
    stage.style.transform = 'scale(' + zoom + ')';
    // Без поворота сцена растёт вниз, страницу скроллит браузер — как раньше.
    stage.classList.remove('scrollable');
    document.body.style.overflow = '';
  }
  localStorage.setItem('cl_tv_zoom', String(zoom));
  localStorage.setItem('cl_tv_rotate', String(rotate));
}
applyTransform();

// Прокрутка повёрнутого табло: колесо мыши и тач работают сами (сцена — скроллер,
// её локальная ось после поворота вертикальна на экране). Клавиши — для пульта/
// аэро-мыши: ↑↓ — построчно, PageUp/PageDown — на экран, Home/End — в начало/конец.
function scrollStageBy(key) {
  var stage = document.getElementById('stage');
  var page = stage.clientHeight * 0.9;
  var delta = { ArrowDown: 150, ArrowUp: -150, PageDown: page, PageUp: -page }[key];
  if (key === 'Home') stage.scrollTo({ top: 0, behavior: 'smooth' });
  else if (key === 'End') stage.scrollTo({ top: stage.scrollHeight, behavior: 'smooth' });
  else if (delta != null) stage.scrollBy({ top: delta, behavior: 'smooth' });
  else return false;
  return true;
}

document.addEventListener('keydown', function (e) {
  if (rotate && scrollStageBy(e.key)) {
    pauseAutoscroll();
    e.preventDefault();
    return;
  }
  if (e.key === '+' || e.key === '=') zoom = Math.min(3, Math.round((zoom + 0.05) * 100) / 100);
  else if (e.key === '-') zoom = Math.max(0.3, Math.round((zoom - 0.05) * 100) / 100);
  else if (e.key === '0') zoom = 1;
  else if (e.key === 't' || e.key === 'T' || e.key === 'е' || e.key === 'Е') {
    theme = theme === 'dark' ? 'light' : 'dark';
    applyTheme();
    return;
  }
  else return;
  applyTransform();
});

// Автопрокрутка повёрнутого табло: ?autoscroll=60 (скорость, пикселей локальной оси
// в секунду; 0/пусто — выкл). Запоминается в localStorage. Табло на ТВ обычно без
// клавиатуры, поэтому при переполнении сцена медленно «плывёт» вниз-вверх с паузой
// у краёв; ручная прокрутка приостанавливает автоскролл на 10 секунд.
var autoscrollSpeed = parseFloat(params.get('autoscroll')) ||
  parseFloat(localStorage.getItem('cl_tv_autoscroll')) || 0;
var autoscrollPausedUntil = 0;
function pauseAutoscroll() { autoscrollPausedUntil = Date.now() + 10000; }
if (autoscrollSpeed > 0) {
  localStorage.setItem('cl_tv_autoscroll', String(autoscrollSpeed));
  var scrollDir = 1;
  var edgePauseUntil = 0;
  ['wheel', 'touchstart'].forEach(function (ev) {
    document.getElementById('stage').addEventListener(ev, pauseAutoscroll, { passive: true });
  });
  (function autoScrollTick() {
    requestAnimationFrame(function frame(now) {
      var stage = document.getElementById('stage');
      if (rotate && Date.now() >= autoscrollPausedUntil && Date.now() >= edgePauseUntil) {
        var max = stage.scrollHeight - stage.clientHeight;
        if (max > 0) {
          var next = stage.scrollTop + scrollDir * autoscrollSpeed / 60;
          if (next >= max) { next = max; scrollDir = -1; edgePauseUntil = Date.now() + 3000; }
          else if (next <= 0) { next = 0; scrollDir = 1; edgePauseUntil = Date.now() + 3000; }
          stage.scrollTop = next;
        }
      }
      requestAnimationFrame(frame);
    });
  })();
}
var STATUS_LABELS = { planned: 'К стирке', in_progress: 'В работе', done: 'Готово', stored: 'На складе',
  no_linen: 'Нет белья', ready_clean: 'Чистое на складе', partial: 'Частично' };
// Порядок на табло (spec §7.4): «В работе» → «К стирке» → «Готово»/«На складе»
var ORDER = { in_progress: 0, planned: 1, partial: 1, no_linen: 1.5, done: 2, stored: 2, ready_clean: 2 };
var lastDataAt = null;
var lastRes = null;
// Вид табло: 'list' (списком, колонки) или 'rows' (по строкам) — как на вкладке «Стирка»
var viewMode = localStorage.getItem('cl_tv_view') === 'rows' ? 'rows' : 'list';

document.getElementById('viewListBtn').onclick = function () { setView('list'); };
document.getElementById('viewRowsBtn').onclick = function () { setView('rows'); };

function setView(mode) {
  viewMode = mode;
  localStorage.setItem('cl_tv_view', mode);
  syncToggle();
  if (lastRes) render(lastRes);
}
function syncToggle() {
  document.getElementById('viewListBtn').className = viewMode === 'list' ? 'on' : '';
  document.getElementById('viewRowsBtn').className = viewMode === 'rows' ? 'on' : '';
}
syncToggle();

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

function tickClock() {
  // Часы табло — локальное время устройства, дата смены — только с сервера
  var d = new Date();
  document.getElementById('clock').textContent =
    ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}
setInterval(tickClock, 5000); tickClock();

function poll() {
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || res.ok === false) return showOffline();
      hideOffline();
      render(res);
    })
    .withFailureHandler(showOffline)
    .getTvData(KEY);
}

function showOffline() {
  if (lastDataAt) document.getElementById('offlineTime').textContent = lastDataAt;
  document.getElementById('offline').classList.add('show');
}
function hideOffline() { document.getElementById('offline').classList.remove('show'); }

function render(res) {
  lastRes = res;
  lastDataAt = res.updatedAt;
  document.getElementById('laundryName').textContent = res.laundryName;
  document.getElementById('date').textContent = res.date;
  document.getElementById('fresh').textContent = 'данные на ' + res.updatedAt;

  var c = res.counters;
  var cells = [
    ['Всего', c.total], ['К стирке', c.planned], ['В работе', c.in_progress], ['Готово', c.done]
  ];
  document.getElementById('counters').innerHTML = cells.map(function (x) {
    return '<div class="counter"><div class="num">' + x[1] + '</div><div class="lbl">' + x[0] + '</div></div>';
  }).join('');

  var cards = (res.washes || []).slice().sort(function (a, b) {
    return (ORDER[a.status] != null ? ORDER[a.status] : 9) - (ORDER[b.status] != null ? ORDER[b.status] : 9);
  });
  function cardHtml(w) {
    var meta = [];
    if (w.kg !== '') meta.push(w.kg + ' кг');
    if (w.items !== '') meta.push(w.items + ' шт');
    return '<div class="card st-' + w.status + '">' +
      '<div class="client">' + esc(w.client) + '</div>' +
      '<span class="chip">' + (STATUS_LABELS[w.status] || esc(w.status)) + '</span>' +
      (w.deferred_from ? ' <span class="chip chip-deferred">перенесена с ' + esc(w.deferred_from) + '</span>' : '') +
      (meta.length ? '<div class="meta">' + meta.join(' · ') + '</div>' : '') +
      (w.comment ? '<div class="comment">💬 ' + esc(w.comment) + '</div>' : '') +
      '</div>';
  }

  // Колонки как на вкладке «Стирка» в приложении (там же и «partial» в «Готово»)
  var COLS = [
    { title: 'К стирке', match: function (w) { return w.status === 'planned'; } },
    { title: 'В работе', match: function (w) { return w.status === 'in_progress'; } },
    { title: 'Готово', match: function (w) { return w.status === 'done' || w.status === 'stored' || w.status === 'partial' || w.status === 'ready_clean' || w.status === 'no_linen'; } }
  ];
  var arrows = ['→ к стирке', '→ в работе', '→ готово'];
  var colIdx = function (w) {
    for (var i = 0; i < COLS.length; i++) if (COLS[i].match(w)) return i;
    return -1;
  };

  var board = document.getElementById('grid');
  if (!cards.length) {
    board.className = 'grid';
    board.innerHTML = '<div class="empty">На сегодня стирок нет</div>';
    return;
  }
  if (viewMode === 'rows') {
    // «По строкам»: каждый клиент держит свою строку, в пустых ячейках — призрак
    board.className = 'rows-board';
    board.innerHTML = COLS.map(function (c) { return '<div class="col-head">' + c.title + '</div>'; }).join('') +
      cards.map(function (w) {
        var active = colIdx(w);
        return COLS.map(function (c, i) {
          if (i === active) return cardHtml(w);
          return '<div class="card ghost"><div class="client">' + esc(w.client) + '</div>' +
            '<div class="arrow">' + (active >= 0 ? arrows[active] : '') + '</div></div>';
        }).join('');
      }).join('');
  } else {
    // «Списком»: каждая колонка — простой список карточек
    board.className = 'cols';
    board.innerHTML = COLS.map(function (c) {
      var list = cards.filter(c.match);
      return '<div class="col"><h2>' + c.title + ' (' + list.length + ')</h2>' +
        (list.length ? list.map(cardHtml).join('') : '<div class="col-empty">—</div>') + '</div>';
    }).join('');
  }
}

poll();
setInterval(poll, 45000); // автополлинг каждые 45 сек (spec §7.4: 30–60 сек)
</script>
</body>
</html>
