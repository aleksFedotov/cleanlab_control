// ===== Экран водителя =====
function loadDriver(date) {
  if (date) state.date = date;
  var d = state.date;
  var call = d ? api('getDriverRoute', state.token, d) : api('getDriverRoute', state.token, '');
  call.then(function (res) {
    state.date = res.date;
    if (!state.today && !d) state.today = res.date;
    state.route = res;
    renderDriver();
  }).catch(function () {
    document.getElementById('app').innerHTML =
      '<div class="pin-wrap"><h1>Прачка360</h1>' +
      '<div class="empty">Не удалось загрузить маршрут. Проверьте связь.</div>' +
      '<button class="btn btn-primary btn-big" id="retryLoad">Повторить</button></div>';
    document.getElementById('retryLoad').onclick = function () { loadDriver(); };
  });
}

function renderDriver() {
  var route = state.route;
  var cargo = route.cargo || { clean_bags: 0, clean_points: 0, dirty_points: 0 };
  state.drvFilter = state.drvFilter || 'all';
  // Сводка по точкам дня
  var needDeliver = 0, needPickup = 0, bothCnt = 0;
  route.visits.forEach(function (v) {
    if (v.status !== 'planned') return;
    var d = (v.has_clean && !v.clean_taken_at) || (v.clean_taken_at && !v.delivered_at);
    var p = !v.picked_at;
    if (d && p) bothCnt++; else if (d) needDeliver++; else if (p) needPickup++;
  });
  var html = '<div class="app-header"><h1>' + esc(route.laundryName || 'Прачка360') + '</h1>' +
    '<div class="spacer"></div>' +
    '<button class="btn btn-ghost" id="logoutBtn">Выход</button></div>' +
    '<div class="container">' +
    '<div class="date-nav"><button id="prevDay">‹</button><button class="date-jump" id="dateJump">' + esc(state.date) + '</button><button id="nextDay">›</button>' +
    (state.date !== state.today ? '<button class="today-btn" id="todayBtn">Сегодня</button>' : '') + '</div>';

  // Мой груз: бельё, которое физически у водителя (по всем дням)
  if (cargo.clean_points || cargo.dirty_points) {
    html += '<div class="card"><h2>🚚 Мой груз</h2>' +
      '<div class="meta">🟦 Чистое: <b>' + cargo.clean_bags + ' меш.</b> (' + cargo.clean_points + ' точек)</div>' +
      '<div class="meta">🟥 Грязное: <b>' + cargo.dirty_points + ' точек</b></div>' +
      (cargo.dirty_points
        ? '<div class="row"><button class="btn btn-primary btn-big" id="handoverBtn">Передать грязное на склад</button></div>'
        : '') + '</div>';
  }

  // Массовое действие: взять чистое сразу по всем точкам, где оно есть на складе
  var toTake = route.visits.filter(function (v) {
    return v.status === 'planned' && v.has_clean && !v.clean_taken_at;
  });
  if (toTake.length >= 2) {
    html += '<div class="row"><button class="btn btn-primary btn-big" id="takeAllBtn">📦 Взять всё чистое со склада (' + toTake.length + ' точек)</button></div>';
  }

  if (!route.visits.length) {
    html += '<div class="empty">На ' + esc(state.date) + ' развоза нет</div>';
  } else {
    html += '<div class="meta" style="margin-bottom:6px">Точек: <b>' + route.visits.length + '</b>' +
      (bothCnt ? ' · оба действия: ' + bothCnt : '') +
      (needDeliver ? ' · отвезти: ' + needDeliver : '') +
      (needPickup ? ' · забрать: ' + needPickup : '') + '</div>' +
      '<div class="view-toggle" style="margin:0 0 10px">' +
      [['all', 'Все'], ['deliver', 'Отвезти'], ['pickup', 'Забрать']].map(function (f) {
        return '<button data-dfilter="' + f[0] + '" class="' + (state.drvFilter === f[0] ? 'on' : '') + '">' + f[1] + '</button>';
      }).join('') + '</div>' +
      route.visits.map(function (v) {
        var done = v.status !== 'planned';
        var meta = [];
        if (v.address) meta.push(esc(v.address));
        var needD = false, needP = false;
        if (!done) {
          if (v.clean_taken_at && !v.delivered_at) { meta.push('🚚 чистое у вас' + (Number(v.clean_bags) ? ': ' + v.clean_bags + ' меш.' : '')); needD = true; }
          else if (v.has_clean) { meta.push('✨ чистое: ' + v.clean_kg + ' кг / ' + v.clean_items + ' шт'); needD = true; }
          if (v.picked_at) meta.push('🟥 грязное у вас');
          else { needP = true; meta.push('🧺 забрать грязное'); }
        }
        return '<div class="wcard' + (done ? ' done' : ' drv') + '"' + (done ? '' : ' data-open="' + v.id + '"') +
          ' data-needd="' + (needD ? 1 : 0) + '" data-needp="' + (needP ? 1 : 0) + '">' +
          '<div class="nm">' + esc(v.client_name) + '</div>' +
          (meta.length ? '<div class="cm">' + meta.join(' · ') + '</div>' : '') +
          (done ? '<div class="cm">' + (STATUS_LABELS[v.status] || v.status) + ' ✓</div>' : '') +
          '</div>';
      }).join('');
  }
  html += '</div>';
  document.getElementById('app').innerHTML = html;
  document.getElementById('prevDay').onclick = function () { loadDriver(shiftDateStr(state.date, -1)); };
  document.getElementById('nextDay').onclick = function () { loadDriver(shiftDateStr(state.date, 1)); };
  document.getElementById('dateJump').onclick = function () { openDateJump(loadDriver); };
  var todayBtn = document.getElementById('todayBtn');
  if (todayBtn) todayBtn.onclick = function () { loadDriver(state.today); };
  document.getElementById('logoutBtn').onclick = function () {
    api('logout', state.token).finally(backToPin);
  };
  var handoverBtn = document.getElementById('handoverBtn');
  if (handoverBtn) handoverBtn.onclick = function () {
    confirmDialog('Передать всё грязное бельё на склад?', 'Передать', function () {
      api('driverHandover', state.token).then(function (res) {
        toast('Передано на склад: ' + res.handed + ' ✓');
        loadDriver(state.date);
      }).catch(function (e) { toast(e.message, true); });
    });
  };
  var takeAllBtn = document.getElementById('takeAllBtn');
  if (takeAllBtn) takeAllBtn.onclick = function () {
    var n = route.visits.filter(function (v) {
      return v.status === 'planned' && v.has_clean && !v.clean_taken_at;
    }).length;
    confirmDialog('Взять чистое бельё для ' + n + ' точек?', 'Да, взял', function () {
      api('driverTakeAllClean', state.token, state.date).then(function (res) {
        toast('Взято: ' + res.taken + ' точек, ' + res.bags + ' меш. ✓');
        loadDriver(state.date);
      }).catch(function (e) { toast(e.message, true); });
    });
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-dfilter]'), function (b) {
    b.onclick = function () {
      state.drvFilter = b.dataset.dfilter;
      renderDriver();
    };
  });
  // Фильтрация карточек по выбранному фильтру
  Array.prototype.forEach.call(document.querySelectorAll('.wcard[data-needd]'), function (c) {
    if (state.drvFilter === 'deliver' && c.dataset.needd !== '1') c.style.display = 'none';
    if (state.drvFilter === 'pickup' && c.dataset.needp !== '1') c.style.display = 'none';
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-open]'), function (el) {
    el.onclick = function () {
      var v = route.visits.filter(function (x) { return x.id === el.dataset.open; })[0];
      if (v) openDriverVisit(v);
    };
  });
}

// Диалог действий водителя: кнопки по состоянию точки и белья.
function openDriverVisit(v) {
  var meta = [];
  if (v.address) meta.push(esc(v.address));
  var rows = '';
  if (v.clean_taken_at && !v.delivered_at) {
    meta.push('🚚 чистое у вас' + (Number(v.clean_bags) ? ': ' + v.clean_bags + ' меш.' : ''));
    rows += '<div class="row"><button class="btn btn-primary btn-big" data-act="deliver_clean">Отдал чистое</button></div>';
  } else if (v.has_clean) {
    meta.push('✨ чистое на складе: ' + v.clean_kg + ' кг / ' + v.clean_items + ' шт');
    rows += '<div class="row"><button class="btn btn-primary btn-big" data-act="take_clean">Взял чистое</button></div>';
  }
  if (v.picked_at) {
    meta.push('🟥 грязное у вас');
  } else {
    rows += '<div class="row"><button class="btn btn-primary btn-big" data-act="pickup_dirty">Забрал грязное</button></div>';
  }
  if (!v.clean_taken_at && !v.picked_at) {
    rows += '<div class="row"><button class="btn btn-ghost btn-big" data-act="empty">Ничего нет</button></div>';
  }
  showDialog('<h2>' + esc(v.client_name) + '</h2>' +
    (meta.length ? '<div class="meta" style="margin-bottom:8px">' + meta.join(' · ') + '</div>' : '') +
    rows +
    '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Назад</button></div>');
  document.getElementById('dlgCancel').onclick = hideDialog;
  Array.prototype.forEach.call(document.querySelectorAll('[data-act]'), function (b) {
    b.onclick = function () {
      var act = b.dataset.act;
      var run = function () {
        api('driverAction', state.token, v.id, act)
          .then(function () { hideDialog(); toast('Отмечено ✓'); loadDriver(state.date); })
          .catch(function (e) { hideDialog(); toast(e.message, true); loadDriver(state.date); });
      };
      if (act === 'take_clean') {
        hideDialog();
        confirmDialog('Чистое бельё взято со склада?', 'Да, взял', run);
      } else {
        busy(b, '…');
        run();
      }
    };
  });
}

// ===== Экран владельца: вкладки =====
function ownerTabs(active) {
  if (state.role !== 'owner') return '';
  var tabs = [['day', 'Стирка'], ['delivery', 'Сегодня'], ['week', 'План'], ['storage', 'Склад'], ['report', 'Отчёт'], ['refs', 'Справочники']];
  return '<div class="tabs">' + tabs.map(function (t) {
    return '<button data-view="' + t[0] + '"' + (t[0] === active ? ' class="active"' : '') + '>' + t[1] + '</button>';
  }).join('') + '</div>';
}
function bindTabs() {
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) {
    b.onclick = function () { navigate(b.dataset.view); };
  });
}
function navigate(view) {
  state.view = view;
  if (view === 'day') renderDay();
  else if (view === 'delivery') renderDelivery();
  else if (view === 'week') renderWeek();
  else if (view === 'storage') renderStorage();
  else if (view === 'report') renderReport(state.today);
  else if (view === 'refs') renderRefs();
}

function shiftDateStr(dateStr, days) {
  var p = dateStr.split('-').map(Number);
  var dt = new Date(Date.UTC(p[0], p[1] - 1, p[2]) + days * 86400000);
  return dt.getUTCFullYear() + '-' + ('0' + (dt.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + dt.getUTCDate()).slice(-2);
}

// Каркас экрана владельца: шапка + вкладки + контейнер
function appShell(title, tab, containerHtml, wide) {
  document.getElementById('app').innerHTML =
    '<div class="app-header"><h1>' + esc(title) + '</h1><div class="spacer"></div>' +
    '<button class="btn btn-ghost" id="logoutBtn">Выход</button></div>' +
    ownerTabs(tab) + '<div class="container' + (wide ? ' wide' : '') + '">' + containerHtml + '</div>';
  document.getElementById('logoutBtn').onclick = function () {
    api('logout', state.token).finally(backToPin);
  };
  bindTabs();
}
function setContainer(html) { document.querySelector('.container').innerHTML = html; }

// ===== Сегодня (развоз дня): контроль готовности, не планировщик =====
function renderDelivery(date) {
  if (!date) date = state.today;
  appShell('Сегодня', 'delivery', '<div class="empty">Загружаем…</div>');
  api('getDeliveryVisits', state.token, date).then(function (res) {
    var addrByClient = {};
    res.clients.forEach(function (c) { addrByClient[c.id] = c.address; });
    var notReadyByClient = {};
    (res.notReady || []).forEach(function (n) { notReadyByClient[n.client_id] = n.reason; });
    var readyCnt = res.visits.filter(function (v) { return v.has_clean; }).length;

    var html = '<div class="date-nav"><button id="dlPrev">‹</button>' +
      '<button class="date-jump" id="dlJump">' + esc(formatDateRu(date)) + '</button>' +
      '<button id="dlNext">›</button>' +
      (date !== state.today ? '<button class="today-btn" id="dlToday">Сегодня</button>' : '') + '</div>';

    if (res.visits.length) {
      html += '<div class="meta" style="margin-bottom:8px">' +
        ((res.notReady || []).length
          ? '⚠ <b>' + res.notReady.length + ' из ' + res.visits.length + '</b> не готовы · '
          : '') +
        '<b>' + readyCnt + '</b> готовы к развозу</div>';
    }

    if (res.notReady && res.notReady.length) {
      var REASONS = { washing_incomplete: 'стирка не завершена', partial: 'стирка частичная', no_clean: 'нет чистого белья' };
      html += '<div class="blockers"><b>⚠ Не готовы к развозу:</b>' + res.notReady.map(function (n) {
        return '<div class="brow">' + esc(n.client_name) + ' <span class="why">— ' + (REASONS[n.reason] || n.reason) + '</span></div>';
      }).join('') + '</div>';
    }

    html += '<h2>Визиты (' + res.visits.length + ')</h2>' +
      (res.visits.length ? res.visits.map(function (v) {
        var meta = [];
        if (addrByClient[v.client_id]) meta.push(esc(addrByClient[v.client_id]));
        if (v.clean_taken_at) meta.push('🚚 чистое у водителя');
        else if (v.has_clean) meta.push('✨ чистое: ' + v.clean_kg + ' кг / ' + v.clean_items + ' шт');
        if (v.has_dirty) meta.push('🧺 грязное в цеху');
        var icon = v.status !== 'planned' ? ''
          : notReadyByClient[v.client_id] ? '🔴 '
          : v.clean_taken_at ? '🚚 '
          : v.has_clean ? '🟢 ' : '⚪ ';
        return '<div class="vrow"><div class="nm">' + icon + esc(v.client_name) +
          (meta.length ? '<div class="cm">' + meta.join(' · ') + '</div>' : '') + '</div>' +
          (v.status === 'planned'
            ? '<button class="rm" data-rm="' + v.id + '" data-name="' + esc(v.client_name) + '" title="Убрать из развоза">✕</button>'
            : '<span class="chip chip-' + v.status + '">' + (STATUS_LABELS[v.status] || v.status) + '</span>') +
          '</div>';
      }).join('') : '<div class="empty">Развоз пуст — добавьте клиентов ниже или на вкладке «План»</div>');

    var inDelivery = {};
    res.visits.forEach(function (v) { inDelivery[v.client_id] = 1; });
    var available = res.clients.filter(function (c) { return !inDelivery[c.id]; });
    html += '<h2>Добавить</h2>' +
      '<input class="search-input" id="dlSearch" placeholder="Начните вводить имя клиента…">' +
      '<div id="dlResults"></div>';
    setContainer(html);

    document.getElementById('dlPrev').onclick = function () { renderDelivery(shiftDateStr(date, -1)); };
    document.getElementById('dlNext').onclick = function () { renderDelivery(shiftDateStr(date, 1)); };
    document.getElementById('dlJump').onclick = function () { openDateJump(renderDelivery, date); };
    var dlToday = document.getElementById('dlToday');
    if (dlToday) dlToday.onclick = function () { renderDelivery(); };

    function renderResults() {
      var q = document.getElementById('dlSearch').value.trim().toLowerCase();
      var box = document.getElementById('dlResults');
      if (!q) { box.innerHTML = ''; return; }
      var found = available.filter(function (c) { return c.name.toLowerCase().indexOf(q) !== -1; });
      box.innerHTML = found.length ? found.map(function (c) {
        return '<div class="vrow"><div class="nm">' + esc(c.name) +
          '<div class="cm">' + esc(c.type) + (c.address ? ' · ' + esc(c.address) : '') +
          (c.storage === 'да' ? ' · складской клиент' : '') + '</div></div>' +
          '<button class="add" data-add="' + c.id + '" title="Добавить в развоз">+</button></div>';
      }).join('') : '<div class="empty" style="padding:16px 0">Никого не найдено</div>';
      Array.prototype.forEach.call(box.querySelectorAll('[data-add]'), function (b) {
        b.onclick = function () {
          busy(b, '…');
          api('addDeliveryVisit', state.token, b.dataset.add, date)
            .then(function () { toast('Добавлено в развоз ✓'); renderDelivery(date); })
            .catch(function (e) { unbusy(b); toast(e.message, true); });
        };
      });
    }
    document.getElementById('dlSearch').oninput = renderResults;

    Array.prototype.forEach.call(document.querySelectorAll('[data-rm]'), function (b) {
      b.onclick = function () {
        confirmDialog('Убрать «' + b.dataset.name + '» из развоза?', 'Убрать', function () {
          busy(document.getElementById('dlgOk'), '…');
          api('removeDeliveryVisit', state.token, b.dataset.rm)
            .then(function () { hideDialog(); toast('Убрано'); renderDelivery(date); })
            .catch(function (e) { hideDialog(); toast(e.message, true); });
        });
      };
    });
  }).catch(function (e) {
    setContainer('<div class="empty">Не удалось загрузить развоз: ' + esc(e.message) + '</div>' +
      '<button class="btn btn-primary btn-big" id="dlRetry">Повторить</button>');
    document.getElementById('dlRetry').onclick = function () { renderDelivery(date); };
  });
}

// ===== План на неделю (канбан выдачи) =====
var WEEKDAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
function mondayOfStr(dateStr) {
  var p = dateStr.split('-').map(Number);
  var dow = new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay(); // 0=вс..6=сб
  return shiftDateStr(dateStr, -((dow + 6) % 7));
}
function renderWeek() {
  if (!state.weekMonday) state.weekMonday = mondayOfStr(state.today);
  appShell('План', 'week', '<div class="empty">Загружаем…</div>', true);
  api('getWeekPlan', state.token, state.weekMonday).then(function (res) {
    state.weekMonday = res.monday;
    var html = '<div class="row" style="margin-top:0">' +
      '<button class="btn btn-ghost" id="wkPrev">‹</button>' +
      '<div style="text-align:center;font-weight:700;font-size:18px">' +
        res.days[0].date + ' — ' + res.days[6].date + '</div>' +
      '<button class="btn btn-ghost" id="wkNext">›</button></div>' +
      '<div class="week-board">' + res.days.map(function (d, i) {
        var cards = d.cards.map(function (c) {
          return '<div class="wcard" data-card="' + c.id + '">' +
            '<div class="nm">' + esc(c.client_name) + '</div>' +
            '<div class="cm">' + (STATUS_LABELS[c.status] || c.status) +
              (c.has_clean ? ' · ✨ чистое' : '') + (c.has_dirty ? ' · 🧺 грязное' : '') + '</div></div>';
        }).join('');
        return '<div class="week-col' + (d.date === state.today ? ' today' : '') + '">' +
          '<h3>' + WEEKDAYS[i] + ' ' + d.date.slice(5) + '</h3>' + cards +
          '<button class="week-add" data-addday="' + d.date + '">+</button></div>';
      }).join('') + '</div>';
    setContainer(html);
    document.getElementById('wkPrev').onclick = function () { state.weekMonday = shiftDateStr(res.monday, -7); renderWeek(); };
    document.getElementById('wkNext').onclick = function () { state.weekMonday = shiftDateStr(res.monday, 7); renderWeek(); };
    Array.prototype.forEach.call(document.querySelectorAll('[data-addday]'), function (b) {
      b.onclick = function () {
        var day = res.days.filter(function (d) { return d.date === b.dataset.addday; })[0];
        openWeekAdd(b.dataset.addday, res.clients, day ? day.cards : []);
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-card]'), function (el) {
      el.onclick = function () {
        var found = null;
        res.days.forEach(function (d) {
          d.cards.forEach(function (x) { if (x.id === el.dataset.card) found = x; });
        });
        if (found) openWeekCard(found, res.days);
      };
    });
  }).catch(function (e) { setContainer('<div class="empty">' + esc(e.message) + '</div>'); });
}

function openWeekAdd(date, clients, cards) {
  if (!clients.length) return toast('Сначала добавьте клиента в Справочниках');
  var inDay = {};
  (cards || []).forEach(function (c) { inDay[c.client_id] = true; });
  showDialog('<h2>Развоз ' + date + '</h2>' +
    '<div class="meta" style="margin-bottom:6px">Отметьте клиентов (можно несколько):</div>' +
    '<div style="max-height:50vh;overflow-y:auto">' + clients.map(function (c) {
      var taken = inDay[c.id];
      return '<div class="row"><label style="font-size:16px' + (taken ? ';color:#98a2b3' : '') + '">' +
        '<input type="checkbox" class="wcPick" value="' + c.id + '"' + (taken ? ' disabled' : '') + '> ' +
        esc(c.name) + (taken ? ' — уже в развозе' : '') + '</label></div>';
    }).join('') + '</div>' +
    '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Назад</button>' +
    '<button class="btn btn-primary" id="dlgOk">Добавить выбранных</button></div>');
  document.getElementById('dlgCancel').onclick = hideDialog;
  var okBtn = document.getElementById('dlgOk');
  okBtn.onclick = function () {
    var ids = Array.prototype.map.call(document.querySelectorAll('.wcPick:checked'), function (b) { return b.value; });
    if (!ids.length) return toast('Отметьте хотя бы одного клиента');
    busy(okBtn, 'Сохраняем…');
    // Добавляем последовательно, чтобы не гонять запросы параллельно
    var chain = Promise.resolve();
    ids.forEach(function (cid) {
      chain = chain.then(function () { return api('addWeekCard', state.token, cid, date); });
    });
    chain.then(function () { hideDialog(); toast('Добавлено: ' + ids.length + ' ✓'); renderWeek(); })
      .catch(function (e) { hideDialog(); toast(e.message, true); renderWeek(); });
  };
}

function openWeekCard(c, days) {
  if (c.status !== 'planned') {
    showDialog('<h2>' + esc(c.client_name) + '</h2>' +
      '<div class="meta">Статус: ' + (STATUS_LABELS[c.status] || c.status) +
      ' — перенос и удаление недоступны</div>' +
      '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Назад</button></div>');
    document.getElementById('dlgCancel').onclick = hideDialog;
    return;
  }
  showDialog('<h2>' + esc(c.client_name) + '</h2>' +
    '<div class="meta" style="margin-bottom:8px">Перенести визит на:</div>' +
    '<div class="row" style="flex-wrap:wrap">' + days.map(function (d, i) {
      return '<button class="btn btn-ghost" data-mv="' + d.date + '"' +
        (d.date === c.date ? ' disabled' : '') + '>' + WEEKDAYS[i] + ' ' + d.date.slice(5) + '</button>';
    }).join('') + '</div>' +
    '<div class="actions"><button class="btn btn-danger" id="wcDel">Убрать</button>' +
    '<button class="btn btn-ghost" id="dlgCancel">Назад</button></div>');
  document.getElementById('dlgCancel').onclick = hideDialog;
  Array.prototype.forEach.call(document.querySelectorAll('[data-mv]'), function (b) {
    b.onclick = function () {
      busy(b, '…');
      api('moveWeekCard', state.token, c.id, b.dataset.mv)
        .then(function () { hideDialog(); toast('Перенесено ✓'); renderWeek(); })
        .catch(function (e) { hideDialog(); toast(e.message, true); });
    };
  });
  document.getElementById('wcDel').onclick = function () {
    confirmDialog('Убрать карточку «' + c.client_name + '» из недели?', 'Убрать', function () {
      api('removeWeekCard', state.token, c.id)
        .then(function () { hideDialog(); toast('Убрано'); renderWeek(); })
        .catch(function (e) { hideDialog(); toast(e.message, true); });
    });
  };
}

// ===== Склад =====
// Единые карточки во всех секциях; детали и кнопки — по тапу на карточку.
function renderStorage() {
  appShell('Склад', 'storage', '<div class="empty">Загружаем…</div>');
  api('getStorage', state.token).then(function (res) {
    var types = {};
    (res.itemTypes || []).forEach(function (t) { types[t.id] = t.name; });

    // Единый список белья: у каждой карточки состояние (грязное/чистое/внимание),
    // а не принадлежность к списку. Статусы дней до выдачи считаем в датах.
    function daysDiff(dateStr) { // сколько дней от dateStr до сегодня (просрочка > 0)
      if (!dateStr) return 0;
      var p = dateStr.split('-').map(Number), t = state.today.split('-').map(Number);
      return Math.round((Date.UTC(t[0], t[1] - 1, t[2]) - Date.UTC(p[0], p[1] - 1, p[2])) / 86400000);
    }

    var entries = [];
    res.stored.forEach(function (w) {
      entries.push({ kind: 'clean', id: w.id, client_id: w.client_id, client_name: w.client_name,
        kg: w.dirty_weight_kg, total: w.items_total, bags: Number(w.bags) || 0,
        items: w.items || [], issue_date: w.issue_date });
    });
    (res.cleanReady || []).forEach(function (s) {
      entries.push({ kind: 'clean', id: s.wash_id, client_id: s.client_id, client_name: s.client_name,
        kg: s.weight_kg, total: s.items_total, bags: Number(s.bags) || 0,
        items: [], issue_date: s.issue_date || '' });
    });
    (res.partialClean || []).forEach(function (s) {
      entries.push({ kind: 'partial', id: s.id, client_id: s.client_id, client_name: s.client_name,
        kg: s.weight_kg, total: s.items_total, bags: Number(s.bags) || 0,
        since: (s.created_at || '').slice(0, 10) });
    });
    (res.dirty || []).forEach(function (s) {
      entries.push({ kind: 'dirty', id: s.id, client_id: s.client_id, client_name: s.client_name,
        since: (s.created_at || '').slice(0, 10) });
    });

    // Статус и раскраска карточки
    entries.forEach(function (e) {
      if (e.kind === 'dirty') {
        e.cls = 'st-dirty';
        e.attn = false;
        e.status = '🟠 Ждёт стирки · принято ' + esc(e.since);
        e.rank = 1;
      } else if (e.kind === 'partial') {
        e.cls = 'st-partial';
        e.attn = true;
        e.status = '⚠ Частичная стирка — клиент не готов · с ' + esc(e.since);
        e.rank = 0;
      } else {
        var d = daysDiff(e.issue_date);
        if (d > 0) {
          e.cls = 'st-attn';
          e.attn = true;
          e.badge = '⚠ ' + d + ' дн.';
          e.status = '⚠ Просрочено на ' + d + ' дн.';
          e.rank = 0;
        } else if (d === 0) {
          e.cls = 'st-clean';
          e.attn = false;
          e.status = '⏱ Выдача сегодня';
          e.rank = 2;
        } else {
          e.cls = 'st-clean';
          e.attn = false;
          e.status = '✓ Готово к выдаче';
          e.rank = 3;
        }
      }
    });
    entries.sort(function (a, b) {
      if (a.rank !== b.rank) return a.rank - b.rank;
      return String(a.issue_date || a.since) < String(b.issue_date || b.since) ? -1 : 1;
    });

    var dirtyN = 0, readyN = 0, attnN = 0, totalKg = 0;
    entries.forEach(function (e) {
      if (e.kind === 'dirty') dirtyN++;
      if (e.kind === 'clean') { readyN += e.attn ? 0 : 1; totalKg += Number(e.kg) || 0; }
      if (e.attn) attnN++;
    });

    state.stFilter = state.stFilter || 'all';
    function kindLabel(e) {
      if (e.kind === 'dirty') return '🟠 Грязное';
      if (e.kind === 'partial') return '🟡 Частично';
      return '🟢 Чистое';
    }
    function metaOf(e) {
      if (e.kind === 'dirty') return 'принято ' + esc(e.since);
      var m = (e.kg || 0) + ' кг · ' + (e.total || 0) + ' шт' + (e.bags > 0 ? ' · ' + e.bags + ' меш.' : '');
      if (e.kind === 'partial') return m + ' · с ' + esc(e.since);
      return m + (e.issue_date ? ' · выдача ' + esc(e.issue_date) : '');
    }
    var cardsHtml = entries.map(function (e, i) {
      var action = '';
      if (e.kind === 'dirty') action = '<button class="btn btn-primary" data-act="wash" data-i="' + i + '">Поставить в стирку</button>';
      else if (e.kind === 'clean') action = '<button class="btn btn-primary" data-act="deliv" data-i="' + i + '">В развоз</button>';
      return '<div class="wcard st ' + e.cls + '" data-i="' + i + '" data-kind="' + e.kind + '" data-attn="' + (e.attn ? 1 : 0) + '">' +
        '<div class="nm">' + esc(e.client_name) + (e.badge ? ' <span class="overdue" style="float:right">' + e.badge + '</span>' : '') + '</div>' +
        '<div class="cm">' + kindLabel(e) + ' · ' + metaOf(e) + '</div>' +
        '<div class="cm">' + e.status + '</div>' +
        (action ? '<div class="row" style="margin-top:4px">' + action + '</div>' : '') +
        '</div>';
    }).join('');

    setContainer(
      '<div class="dash">' +
      '<div class="dash-tile"><div class="dash-n" style="color:#e8a13a">' + dirtyN + '</div><div class="dash-l">ждут стирки</div></div>' +
      '<div class="dash-tile"><div class="dash-n" style="color:#1c6b2a">' + readyN + '</div><div class="dash-l">готовы к развозу</div></div>' +
      '<div class="dash-tile"><div class="dash-n" style="color:#c0392b">' + attnN + '</div><div class="dash-l">требуют внимания</div></div>' +
      '<div class="dash-tile"><div class="dash-n">' + Math.round(totalKg * 10) / 10 + '</div><div class="dash-l">кг чистого</div></div>' +
      '</div>' +
      '<input class="search-input" id="stSearch" placeholder="Поиск по клиенту…">' +
      '<div class="view-toggle" style="margin:0 0 10px">' +
      [['all', 'Все'], ['dirty', '🟠 Грязное'], ['clean', '🟢 Чистое'], ['attn', '🔴 Внимание']].map(function (f) {
        return '<button data-sfilter="' + f[0] + '" class="' + (state.stFilter === f[0] ? 'on' : '') + '">' + f[1] + '</button>';
      }).join('') + '</div>' +
      '<div id="stList">' + (cardsHtml || '<div class="empty">Склад пуст</div>') + '</div>');

    function applyFilter() {
      var q = (document.getElementById('stSearch').value || '').trim().toLowerCase();
      Array.prototype.forEach.call(document.querySelectorAll('#stList .wcard'), function (c) {
        var okKind = state.stFilter === 'all' ||
          (state.stFilter === 'attn' ? c.dataset.attn === '1' : c.dataset.kind === state.stFilter);
        var okQ = !q || c.querySelector('.nm').textContent.toLowerCase().indexOf(q) !== -1;
        c.style.display = okKind && okQ ? '' : 'none';
      });
    }
    document.getElementById('stSearch').oninput = applyFilter;
    Array.prototype.forEach.call(document.querySelectorAll('[data-sfilter]'), function (b) {
      b.onclick = function () {
        state.stFilter = b.dataset.sfilter;
        Array.prototype.forEach.call(document.querySelectorAll('[data-sfilter]'), function (x) {
          x.className = x.dataset.sfilter === state.stFilter ? 'on' : '';
        });
        applyFilter();
      };
    });
    applyFilter();

    Array.prototype.forEach.call(document.querySelectorAll('#stList .wcard'), function (el) {
      el.onclick = function () { openStorageCard(entries[Number(el.dataset.i)], types); };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-act]'), function (b) {
      b.onclick = function (ev) {
        ev.stopPropagation();
        var e = entries[Number(b.dataset.i)];
        if (b.dataset.act === 'wash') {
          busy(b, '…');
          api('addUnplannedWash', state.token, e.client_id, 'со склада')
            .then(function () { toast('В плане на сегодня ✓'); renderStorage(); })
            .catch(function (err) { unbusy(b); toast(err.message, true); });
        } else {
          busy(b, '…');
          api('addDeliveryVisit', state.token, e.client_id, shiftDateStr(state.today, 1))
            .then(function () { toast('В развозе на завтра ✓'); })
            .catch(function (err) { unbusy(b); toast(err.message, true); });
        }
      };
    });
  }).catch(function (e) { setContainer('<div class="empty">' + esc(e.message) + '</div>'); });
}

// Диалог карточки склада: подробности + действия (для чистого — «Выдано», «Изменить дату»)
function openStorageCard(e, types) {
  var html = '<h2>' + esc(e.client_name) + '</h2>';
  if (e.kind === 'dirty') {
    html += '<div class="meta">🧺 Грязное бельё, принято: <b>' + esc(e.since) + '</b></div>' +
      '<div class="meta">Вес и количество появятся после стирки.</div>' +
      '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Назад</button></div>';
  } else if (e.kind === 'partial') {
    html += '<div class="meta">Обработано частично: <b>' + (e.kg || 0) + ' кг · ' + (e.total || 0) + ' шт' +
      (e.bags > 0 ? ' · ' + e.bags + ' меш.' : '') + '</b></div>' +
      '<div class="meta">На складе с ' + esc(e.since) + '. Клиент НЕ готов к развозу — вернуть в стирку решает владелец.</div>' +
      '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Назад</button></div>';
  } else {
    var positions = (e.items || []).map(function (it) {
      return esc(types[it.item_type_id] || it.item_type_id) + ' ×' + it.qty;
    }).join(', ');
    var overdueDays = 0;
    if (e.issue_date) {
      var p = e.issue_date.split('-').map(Number), t = state.today.split('-').map(Number);
      overdueDays = Math.round((Date.UTC(t[0], t[1] - 1, t[2]) - Date.UTC(p[0], p[1] - 1, p[2])) / 86400000);
    }
    html += '<div class="meta"><b>' + (e.kg || 0) + ' кг · ' + (e.total || 0) + ' шт' +
      (e.bags > 0 ? ' · ' + e.bags + ' меш.' : '') + '</b></div>' +
      (positions ? '<div class="meta">' + positions + '</div>' : '') +
      '<div class="meta">Выдача: <b>' + esc(e.issue_date) + '</b>' +
      (overdueDays > 0 ? ' · <span class="overdue">⚠ просрочено на ' + overdueDays + ' дн.</span>' : '') + '</div>' +
      '<div class="row"><button class="btn btn-primary btn-big" id="stIssue">Выдано</button></div>' +
      '<div class="row"><button class="btn btn-ghost btn-big" id="stEditDate">Изменить дату</button></div>' +
      '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Назад</button></div>';
  }
  showDialog(html);
  document.getElementById('dlgCancel').onclick = hideDialog;

  var issueBtn = document.getElementById('stIssue');
  if (issueBtn) issueBtn.onclick = function () {
    confirmDialog('Отметить выдачу клиенту «' + e.client_name + '»?', 'Выдано', function () {
      busy(document.getElementById('dlgOk'), 'Сохраняем…');
      api('markIssued', state.token, e.id)
        .then(function () { hideDialog(); toast('Выдано ✓'); renderStorage(); })
        .catch(function (err) { hideDialog(); toast(err.message, true); });
    });
  };
  var editBtn = document.getElementById('stEditDate');
  if (editBtn) editBtn.onclick = function () {
    showDialog('<h2>Дата выдачи</h2>' +
      '<div class="row"><input type="date" id="newIssue" value="' + esc(e.issue_date) + '"></div>' +
      '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Назад</button>' +
      '<button class="btn btn-primary" id="dlgOk">Сохранить</button></div>');
    document.getElementById('dlgCancel').onclick = hideDialog;
    var okBtn = document.getElementById('dlgOk');
    okBtn.onclick = function () {
      busy(okBtn, 'Сохраняем…');
      api('updateIssueDate', state.token, e.id, document.getElementById('newIssue').value)
        .then(function () { hideDialog(); toast('Дата обновлена ✓'); renderStorage(); })
        .catch(function (err) { hideDialog(); toast(err.message, true); });
    };
  };
}

// ===== Отчёт за день =====
var MONTHS_RU = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
  'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
function formatDateRu(dateStr) {
  var p = dateStr.split('-').map(Number);
  return p[2] + ' ' + MONTHS_RU[p[1] - 1] + ' ' + p[0];
}

// Группа статуса для фильтра отчёта
function reportGroup(w) {
  if (w.status === 'cancelled') return 'cancelled';
  if (w.deferred_from) return 'deferred';
  if (['planned', 'no_linen', 'in_progress'].indexOf(w.status) !== -1) return 'todo';
  return 'done'; // done/stored/issued/partial/ready_clean
}
function statusIcon(w) {
  var g = reportGroup(w);
  var label = STATUS_LABELS[w.status] || w.status;
  if (g === 'cancelled') return '⚪ ' + label;
  if (g === 'deferred') return '🟠 Перенесено';
  if (g === 'todo') return w.status === 'in_progress' ? '🔵 ' + label : '🟠 ' + label;
  if (w.status === 'partial') return '🟡 ' + label;
  return '🟢 ' + label;
}

function renderReport(date) {
  appShell('Отчёт за день', 'report', '<div class="empty">Загружаем…</div>');
  api('getDayReport', state.token, date).then(function (res) {
    var r = res.report;
    state.repFilter = state.repFilter || 'all';
    var html = '<div class="card"><div class="row" style="margin-top:0">' +
      '<button class="btn btn-ghost" id="repPrev">‹</button>' +
      '<div style="text-align:center;font-weight:700;font-size:20px">' +
      '<button class="date-jump" id="repJump" style="font-size:20px">' + esc(formatDateRu(r.date)) + '</button></div>' +
      '<button class="btn btn-ghost" id="repNext">›</button></div>' +
      (r.date !== state.today ? '<div class="row"><button class="today-btn" id="repToday" style="flex:none">Сегодня</button></div>' : '') +
      '<div class="dash" style="margin-top:12px">' +
      '<div class="dash-tile"><div class="dash-n" style="color:#1c6b2a">' + r.totalKg + '</div><div class="dash-l">кг постирано</div></div>' +
      '<div class="dash-tile"><div class="dash-n" style="color:#1c6b2a">' + r.washesDone + '</div><div class="dash-l">завершено</div></div>' +
      '<div class="dash-tile"><div class="dash-n" style="color:#e8a13a">' + r.deferred + '</div><div class="dash-l">перенесено</div></div>' +
      '<div class="dash-tile"><div class="dash-n" style="color:#c0392b">' + r.cancelled + '</div><div class="dash-l">отменено</div></div>' +
      '</div>' +
      '<div class="meta">Ушло на склад: <b>' + r.stored + '</b> · Выдано: <b>' + r.issued + '</b>' +
      (res.shift ? ' · Смена: <b>' + (res.shift.status === 'closed' ? 'закрыта в ' + esc(res.shift.closed_at) : 'открыта') + '</b>' : '') +
      '</div></div>';

    // Завершённые и прочие сверху, незавершённые — внизу (spec §7.3)
    var rows = res.washes.slice().sort(function (a, b) {
      var openA = a.status === 'planned' || a.status === 'in_progress' ? 1 : 0;
      var openB = b.status === 'planned' || b.status === 'in_progress' ? 1 : 0;
      return openA - openB;
    });
    html += '<div class="view-toggle" style="margin:0 0 10px">' +
      [['all', 'Все'], ['done', 'Завершено'], ['todo', 'К стирке'], ['deferred', 'Перенесено'], ['cancelled', 'Отменено']].map(function (f) {
        return '<button data-rfilter="' + f[0] + '" class="' + (state.repFilter === f[0] ? 'on' : '') + '">' + f[1] + '</button>';
      }).join('') + '</div>';
    html += rows.length ? '<table class="report"><tr><th>Клиент</th><th>Вес</th><th>Бельё</th><th>Кол-во</th><th>Статус</th><th>Причина</th></tr>' +
      rows.map(function (w, i) {
        var kinds = (w.items || []).length;
        return '<tr data-group="' + reportGroup(w) + '" data-i="' + i + '" style="cursor:pointer"><td>' + esc(w.client_name) + '</td>' +
          '<td>' + (w.dirty_weight_kg ? w.dirty_weight_kg + ' кг' : '—') + '</td>' +
          '<td>' + (kinds ? kinds + ' видов' : '—') + '</td>' +
          '<td>' + (w.items_total ? w.items_total + ' шт.' : '—') + (Number(w.bags) > 0 ? ' · ' + w.bags + ' меш.' : '') + '</td>' +
          '<td>' + statusIcon(w) + '</td>' +
          '<td>' + (w.deferred_from ? 'с ' + esc(w.deferred_from) + (w.deferred_reason ? ': ' + esc(w.deferred_reason) : '') : '—') + '</td></tr>';
      }).join('') + '</table>' : '<div class="empty">Стирок не было</div>';
    setContainer(html);

    document.getElementById('repPrev').onclick = function () { renderReport(shiftDateStr(date, -1)); };
    document.getElementById('repNext').onclick = function () { renderReport(shiftDateStr(date, 1)); };
    document.getElementById('repJump').onclick = function () { openDateJump(renderReport, date); };
    var repToday = document.getElementById('repToday');
    if (repToday) repToday.onclick = function () { renderReport(state.today); };

    Array.prototype.forEach.call(document.querySelectorAll('[data-rfilter]'), function (b) {
      b.onclick = function () {
        state.repFilter = b.dataset.rfilter;
        Array.prototype.forEach.call(document.querySelectorAll('[data-rfilter]'), function (x) {
          x.className = x.dataset.rfilter === state.repFilter ? 'on' : '';
        });
        Array.prototype.forEach.call(document.querySelectorAll('table.report tr[data-group]'), function (tr) {
          tr.style.display = state.repFilter === 'all' || tr.dataset.group === state.repFilter ? '' : 'none';
        });
      };
    });
    // Применить текущий фильтр (при переходе по датам он сохраняется)
    if (state.repFilter !== 'all') {
      Array.prototype.forEach.call(document.querySelectorAll('table.report tr[data-group]'), function (tr) {
        tr.style.display = tr.dataset.group === state.repFilter ? '' : 'none';
      });
    }

    // Клик по строке → детали стирки (+ правка для завершённых)
    Array.prototype.forEach.call(document.querySelectorAll('table.report tr[data-i]'), function (tr) {
      tr.onclick = function () { openReportRow(rows[Number(tr.dataset.i)], date); };
    });
  }).catch(function (e) { setContainer('<div class="empty">' + esc(e.message) + '</div>'); });
}

// Детали строки отчёта: позиции построчно, правка для завершённых
function openReportRow(w, date) {
  var canEdit = w.status === 'done' || w.status === 'stored' || w.status === 'partial';
  var lines = (w.items || []).map(function (it) {
    return '<div class="item-row"><span class="name">' + esc(it.item_name) + '</span><span>×' + it.qty + '</span></div>';
  }).join('');
  showDialog('<h2>' + esc(w.client_name) + '</h2>' +
    '<div class="meta">' + statusIcon(w) + (w.deferred_from ? ' · с ' + esc(w.deferred_from) : '') + '</div>' +
    '<div class="meta"><b>' + (w.dirty_weight_kg ? w.dirty_weight_kg + ' кг' : '—') +
    (w.items_total ? ' · ' + w.items_total + ' шт.' : '') +
    (Number(w.bags) > 0 ? ' · ' + w.bags + ' меш.' : '') + '</b></div>' +
    (w.deferred_reason ? '<div class="meta">Причина переноса: ' + esc(w.deferred_reason) + '</div>' : '') +
    (lines || '<div class="meta">Позиций нет</div>') +
    (canEdit ? '<div class="row"><button class="btn btn-primary btn-big" id="rowEdit">Изменить данные</button></div>' : '') +
    '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Назад</button></div>');
  document.getElementById('dlgCancel').onclick = hideDialog;
  var editBtn = document.getElementById('rowEdit');
  if (editBtn) editBtn.onclick = function () {
    hideDialog();
    openEditDialog(w, function () { renderReport(date); });
  };
}

// Правка веса/пересчёта завершённой из отчёта (spec §7.3)
function openEditDialog(w, onSaved) {
  var types = (state.day && state.day.itemTypes) || [];
  var counts = {};
  (w.items || []).forEach(function (it) { counts[it.item_type_id] = it.qty; });
  showDialog('<h2>Изменить данные: ' + esc(w.client_name) + '</h2>' +
    '<div class="row"><span>Вес, кг</span><input type="number" inputmode="decimal" step="0.1" min="0" id="editWeight" value="' + (w.dirty_weight_kg || 0) + '"></div>' +
    '<div class="row"><span>Мешков</span><input type="number" inputmode="numeric" step="1" min="0" id="editBags" value="' + (w.bags || 0) + '"></div>' +
    types.map(function (t) {
      return '<div class="item-row"><span class="name">' + esc(t.name) + '</span>' +
        '<div class="stepper"><button data-t="' + t.id + '" data-d="-1">−</button>' +
        '<span class="val" id="eq_' + t.id + '">' + (counts[t.id] || 0) + '</span>' +
        '<button data-t="' + t.id + '" data-d="1">+</button></div></div>';
    }).join('') +
    '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Назад</button>' +
    '<button class="btn btn-primary" id="dlgOk">Сохранить</button></div>');
  document.getElementById('dlgCancel').onclick = hideDialog;
  Array.prototype.forEach.call(document.querySelectorAll('#dialog [data-t]'), function (b) {
    b.onclick = function () {
      var q = Math.max(0, (counts[b.dataset.t] || 0) + parseInt(b.dataset.d, 10));
      counts[b.dataset.t] = q;
      document.getElementById('eq_' + b.dataset.t).textContent = q;
    };
  });
  var okBtn = document.getElementById('dlgOk');
  okBtn.onclick = function () {
    busy(okBtn, 'Сохраняем…');
    var items = Object.keys(counts).filter(function (k) { return counts[k] > 0; })
      .map(function (k) { return { item_type_id: k, qty: counts[k] }; });
    var kg = parseFloat(document.getElementById('editWeight').value) || 0;
    var bags = parseInt(document.getElementById('editBags').value, 10) || 0;
    api('editWashData', state.token, w.id, kg, items, bags)
      .then(function () { hideDialog(); toast('Данные обновлены ✓'); onSaved(); })
      .catch(function (e) { hideDialog(); toast(e.message, true); });
  };
}

// ===== Справочники: две вкладки — Клиенты и Виды белья =====
function renderRefs(tab) {
  state.refsTab = tab || state.refsTab || 'clients';
  state.refsFilter = state.refsFilter || 'active'; // all | active | archived
  appShell('Справочники', 'refs', '<div class="empty">Загружаем…</div>');
  api('getRefs', state.token).then(function (res) {
    state.refs = res;
    renderRefsBody();
  }).catch(function (e) { setContainer('<div class="empty">' + esc(e.message) + '</div>'); });
}

function renderRefsBody() {
  var res = state.refs;
  var html = '<div class="subtabs">' +
    '<button id="refsTabClients" class="' + (state.refsTab === 'clients' ? 'on' : '') + '">Клиенты</button>' +
    '<button id="refsTabTypes" class="' + (state.refsTab === 'types' ? 'on' : '') + '">Виды белья</button></div>';

  if (state.refsTab === 'clients') {
    html += '<input class="search-input" id="rcSearch" placeholder="Поиск по названию, адресу, контакту…">' +
      '<div class="view-toggle" style="margin:0 0 10px">' +
      [['all', 'Все'], ['active', 'Активные'], ['archived', 'Архив']].map(function (f) {
        return '<button data-cfilter="' + f[0] + '" class="' + (state.refsFilter === f[0] ? 'on' : '') + '">' + f[1] + '</button>';
      }).join('') + '</div>' +
      '<div id="rcList">' + res.clients.filter(function (c) {
        if (state.refsFilter === 'active') return c.active === 'да';
        if (state.refsFilter === 'archived') return c.active !== 'да';
        return true;
      }).map(function (c) {
        var n = 0;
        try { n = (JSON.parse(c.item_types || '[]') || []).length; } catch (e) {}
        return '<div class="card ref-row" data-copen="' + c.id + '"' + (c.active !== 'да' ? ' style="opacity:.55"' : '') + '>' +
          '<div class="client">' + esc(c.name) + (c.active !== 'да' ? ' (архив)' : '') + '</div>' +
          '<div class="meta">' + esc(c.type) + (c.address ? ' · ' + esc(c.address) : '') +
          (c.contact ? ' · ' + esc(c.contact) : '') + '</div>' +
          '<div class="meta">' + (n ? n + ' видов белья' : 'все виды белья') + ' →</div></div>';
      }).join('') + '</div>' +
      '<div class="row"><button class="btn btn-primary btn-big" id="addClientBtn">+ Добавить клиента</button></div>';
  } else {
    var usage = {};
    res.clients.forEach(function (c) {
      try {
        (JSON.parse(c.item_types || '[]') || []).forEach(function (tid) {
          usage[tid] = (usage[tid] || 0) + 1;
        });
      } catch (e) {}
    });
    html += '<input class="search-input" id="rtSearch" placeholder="Поиск вида белья…">' +
      '<div id="rtList"><div class="item-row" style="font-weight:700;color:#777">' +
      '<span class="name">Название</span><span>Клиентов</span></div>' +
      res.itemTypes.map(function (t) {
        var inactive = t.active !== 'да';
        return '<div class="item-row rt-row"' + (inactive ? ' style="opacity:.55"' : '') + '>' +
          '<span class="name">' + esc(t.name) + '</span>' +
          '<span>' + (usage[t.id] || 0) + '</span>' +
          '<span><button class="btn btn-ghost" data-tedit="' + t.id + '">Изменить</button>' +
          '<button class="btn btn-ghost" data-ttoggle="' + t.id + '" data-active="' + esc(t.active) + '">' +
          (inactive ? 'Вернуть' : 'Архивировать') + '</button></span></div>';
      }).join('') + '</div>' +
      '<div class="row"><button class="btn btn-primary btn-big" id="addTypeBtn">+ Добавить вид</button></div>';
  }
  setContainer(html);

  document.getElementById('refsTabClients').onclick = function () { state.refsTab = 'clients'; renderRefsBody(); };
  document.getElementById('refsTabTypes').onclick = function () { state.refsTab = 'types'; renderRefsBody(); };

  if (state.refsTab === 'clients') {
    document.getElementById('rcSearch').oninput = function () {
      var q = this.value.trim().toLowerCase();
      Array.prototype.forEach.call(document.querySelectorAll('#rcList .ref-row'), function (r) {
        r.style.display = !q || r.textContent.toLowerCase().indexOf(q) !== -1 ? '' : 'none';
      });
    };
    Array.prototype.forEach.call(document.querySelectorAll('[data-cfilter]'), function (b) {
      b.onclick = function () { state.refsFilter = b.dataset.cfilter; renderRefsBody(); };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-copen]'), function (r) {
      r.onclick = function () { renderClientDetail(r.dataset.copen); };
    });
    document.getElementById('addClientBtn').onclick = function () { renderClientDetail(null); };
  } else {
    document.getElementById('rtSearch').oninput = function () {
      var q = this.value.trim().toLowerCase();
      Array.prototype.forEach.call(document.querySelectorAll('#rtList .rt-row'), function (r) {
        r.style.display = !q || r.textContent.toLowerCase().indexOf(q) !== -1 ? '' : 'none';
      });
    };
    document.getElementById('addTypeBtn').onclick = function () { openTypeForm(null); };
    Array.prototype.forEach.call(document.querySelectorAll('[data-tedit]'), function (b) {
      b.onclick = function () {
        openTypeForm(state.refs.itemTypes.find(function (t) { return t.id === b.dataset.tedit; }));
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-ttoggle]'), function (b) {
      b.onclick = function () {
        busy(b, 'Сохраняем…');
        api('saveItemType', state.token, { id: b.dataset.ttoggle, active: b.dataset.active === 'да' ? 'нет' : 'да' })
          .then(function () { renderRefs('types'); })
          .catch(function (e) { unbusy(b); toast(e.message, true); });
      };
    });
  }
}

// Страница клиента: основные поля + виды белья + режим учёта (id=null — новый).
function renderClientDetail(clientId) {
  var c = clientId ? state.refs.clients.find(function (x) { return x.id === clientId; }) : {};
  if (!c) return renderRefs('clients');
  var types = (state.refs.itemTypes || []).filter(function (t) { return t.active === 'да'; });
  var picked = {};
  try { (JSON.parse(c.item_types || '[]') || []).forEach(function (id) { picked[id] = true; }); } catch (e) {}
  var acc = c.accounting === 'weight' || c.accounting === 'count' ? c.accounting : 'both';

  appShell('Справочники', 'refs',
    '<div class="row"><button class="btn btn-ghost" id="backRefs">← Клиенты</button></div>' +
    '<div class="card"><h2>' + (c.id ? esc(c.name) : 'Новый клиент') + '</h2>' +
    '<div class="row"><input type="text" id="cfName" placeholder="Название *" value="' + esc(c.name || '') + '"></div>' +
    '<div class="row"><select id="cfType">' +
      ['отель', 'ресторан', 'спа', 'прочее'].map(function (t) {
        return '<option' + (c.type === t ? ' selected' : '') + '>' + t + '</option>';
      }).join('') + '</select>' +
    '<select id="cfStorage">' +
      '<option value="нет"' + (c.storage !== 'да' ? ' selected' : '') + '>без склада</option>' +
      '<option value="да"' + (c.storage === 'да' ? ' selected' : '') + '>складской</option>' +
    '</select></div>' +
    '<div class="row"><input type="text" id="cfAddress" placeholder="Адрес" value="' + esc(c.address || '') + '"></div>' +
    '<div class="row"><input type="text" id="cfContact" placeholder="Контакт" value="' + esc(c.contact || '') + '"></div>' +
    '<div class="row"><input type="text" id="cfComment" placeholder="Комментарий" value="' + esc(c.comment || '') + '"></div></div>' +

    '<div class="card"><h2>Виды белья</h2>' +
    '<div class="meta">Ничего не отмечено — работник увидит все виды.</div>' +
    types.map(function (t) {
      return '<label style="display:block;padding:6px 0;font-size:16px"><input type="checkbox" class="cfType" value="' + t.id + '"' +
        (picked[t.id] ? ' checked' : '') + '> ' + esc(t.name) + '</label>';
    }).join('') + '</div>' +

    '<div class="card"><h2>Учёт результата</h2>' +
    [['both', 'Вес + количество'], ['weight', 'Только вес'], ['count', 'Только количество']].map(function (o) {
      return '<label class="res-opt"><input type="radio" name="cfAcc" value="' + o[0] + '"' +
        (acc === o[0] ? ' checked' : '') + '><span><b>' + o[1] + '</b></span></label>';
    }).join('') + '</div>' +

    '<div class="row"><button class="btn btn-primary btn-big" id="cfSave">Сохранить клиента</button></div>' +
    (c.id && c.active === 'да'
      ? '<div class="row"><button class="btn btn-danger" id="cfArchive">В архив</button></div>'
      : ''));
  document.getElementById('backRefs').onclick = function () { renderRefs('clients'); };

  document.getElementById('cfSave').onclick = function () {
    var name = document.getElementById('cfName').value.trim();
    if (!name) return toast('Укажите название', true);
    var itemTypeIds = [];
    Array.prototype.forEach.call(document.querySelectorAll('.cfType:checked'), function (cb) {
      itemTypeIds.push(cb.value);
    });
    var accEl = document.querySelector('input[name="cfAcc"]:checked');
    var payload = {
      name: name,
      type: document.getElementById('cfType').value,
      storage: document.getElementById('cfStorage').value,
      address: document.getElementById('cfAddress').value,
      contact: document.getElementById('cfContact').value,
      comment: document.getElementById('cfComment').value,
      item_types: itemTypeIds,
      accounting: accEl ? accEl.value : 'both'
    };
    if (c.id) payload.id = c.id;
    var btn = this;
    busy(btn, 'Сохраняем…');
    api('saveClient', state.token, payload)
      .then(function () { toast('Сохранено ✓'); renderRefs('clients'); })
      .catch(function (e) { unbusy(btn); toast(e.message, true); });
  };

  var archBtn = document.getElementById('cfArchive');
  if (archBtn) archBtn.onclick = function () {
    busy(archBtn, 'Архивируем…');
    api('deleteClient', state.token, c.id)
      .then(function () { toast('Клиент в архиве'); renderRefs('clients'); })
      .catch(function (e) { unbusy(archBtn); toast(e.message, true); });
  };
}
function openTypeForm(t) {
  showDialog('<h2>' + (t ? 'Переименовать тип' : 'Новый тип белья') + '</h2>' +
    '<div class="row"><input type="text" id="tfName" placeholder="Название" value="' + esc(t ? t.name : '') + '"></div>' +
    '<div class="actions"><button class="btn btn-ghost" id="dlgCancel">Назад</button>' +
    '<button class="btn btn-primary" id="dlgOk">Сохранить</button></div>');
  document.getElementById('dlgCancel').onclick = hideDialog;
  var okBtn = document.getElementById('dlgOk');
  okBtn.onclick = function () {
    var name = document.getElementById('tfName').value.trim();
    if (!name) return toast('Укажите название');
    busy(okBtn, 'Сохраняем…');
    var payload = { name: name };
    if (t) payload.id = t.id;
    api('saveItemType', state.token, payload)
      .then(function () { hideDialog(); toast('Сохранено ✓'); renderRefs(); })
      .catch(function (e) { hideDialog(); toast(e.message, true); });
  };
}

// ===== Диалог =====
function showDialog(html) {
  document.getElementById('dialog').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
}
function hideDialog() { document.getElementById('overlay').classList.remove('show'); }

// ===== Старт =====
if (state.token) {
  // Восстановление сессии: дата всегда с сервера; у водителя свой экран
  if (state.role === 'driver') {
    api('getDriverRoute', state.token, '').then(function (res) {
      state.date = res.date; state.today = res.date; state.route = res; renderDriver();
    }).catch(function () { renderPin(); });
  } else {
    api('getDayList', state.token, '').then(function (res) {
      state.date = res.date; state.today = res.date; state.day = res; renderDay();
    }).catch(function () {
      renderPin();
    });
  }
} else {
  renderPin();
}
</script>
</body>
</html>
